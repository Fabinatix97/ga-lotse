# used for e2e tests
server {
    listen 3004;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /usr/share/nginx/html/.csp_config.conf;

    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src $csp_script_hashes 'strict-dynamic' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}