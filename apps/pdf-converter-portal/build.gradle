import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage
import com.bmuschko.gradle.docker.tasks.image.Dockerfile
import com.github.gradle.node.pnpm.task.PnpmTask
import org.apache.commons.codec.digest.DigestUtils
import de.eshg.frontend.PnpmTaskWithNpmDependencies

plugins {
  id 'node'
  id 'source-checks'
  id 'com.bmuschko.docker-remote-api'
  id "eshg.image-push-sign"
  id 'com.avast.gradle.docker-compose'
}

dockerCompose {
    projectName = rootProject.name
    retainContainersOnStartupFailure = true
    useComposeFiles = ["${rootDir}/docker-compose.yaml"]
    startedServices = ['pdf-converter-portal']
}

tasks.named("composeUp").configure {
  dependsOn tasks.named("buildDockerImage")
}

def dockerBuildDir = layout.buildDirectory.dir('docker')

// Prepare config for CSP (hashes and paths)
void writeCspConfig() {
  def indexJs = (fileTree(layout.buildDirectory.dir('dist/assets')).matching {
    include '**/index*.js'
  }.files as List).first

  def hasher = new DigestUtils(DigestUtils.getSha256Digest())
  def hash = hasher.digest(indexJs).encodeBase64().toString()
  hash = "sha256-${hash}"

  def nginxConfig = """# Auto-generated hashe of JS file for script-src CSP

set \$csp_script_hashes "'${hash}'";
"""
  new File(layout.buildDirectory.dir('dist').get().asFile, '.csp_config.conf').text = nginxConfig

  // add integrity header
  def indexHtml = layout.buildDirectory.file('dist/index.html').get().asFile
  indexHtml.text = indexHtml.text.replaceAll("src=\"/assets/${indexJs.name}\"", "integrity=\"${hash}\" src=\"/assets/${indexJs.name}\"")
}

tasks.register('runDev', PnpmTask) {
  dependsOn 'prepareEnvironment'
  args = ['vite']
}

tasks.register('tsc', PnpmTask) {
  dependsOn 'prepareEnvironment'
  args = ['tsc']
}

tasks.register('assemble', PnpmTaskWithNpmDependencies) {
  dependsOn tsc
  args = ['vite', 'build']

  inputs.files(fileTree('src') {
    include '**/*'
  })
  inputs.file('vite.config.ts')
  inputs.file('tsconfig.json')

  outputs.dir(layout.buildDirectory.dir('dist'))

  doLast {
    writeCspConfig()
  }
}

tasks.register('run') {
  dependsOn 'composeUp'
}

tasks.register('build') {
  dependsOn assemble
}



tasks.register('createDockerfile', Dockerfile) {
  def nginxDockerImage = "nginx:1.29.0@sha256:776b2e787034135a7614429eee7f07e7421cfe37718b1e89de3b41366ea2335d"

  from("docker.io/${nginxDockerImage}")

  exposePort(3004)

  runCommand('rm -fr /usr/share/nginx/html/*')
  copyFile('dist', '/usr/share/nginx/html')

  copyFile('nginx.conf', '/etc/nginx/conf.d/default.conf')

  defaultCommand(
    'nginx', '-g', 'daemon off;'
  )
}

tasks.register('copyAssetsToDockerBuildDir', Copy) {
  dependsOn 'assemble'

  into dockerBuildDir

  from file('nginx.conf')

  from(file('build')) {
    include 'dist/**'
  }
}

def buildDockerImage = tasks.register('buildDockerImage', DockerBuildImage) {
  dependsOn 'createDockerfile'
  inputs.files(tasks.named('copyAssetsToDockerBuildDir'))

  if (getTagName() != null) {
    images.add(getImageNameWithTag())
  } else {
    images.add(getImageNameWithLatestTag())
  }
}
