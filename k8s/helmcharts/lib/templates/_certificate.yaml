{{- define "lib.validateExternalTlsSecret" -}}
{{- $secretName := index . 0 -}}
{{- $namespace := index . 1 -}}
{{- $secret := lookup "v1" "Secret" $namespace $secretName -}}
{{- if not $secret -}}
{{- fail (printf "external TLS secret %q not found in namespace %q" $secretName $namespace) -}}
{{- end -}}
{{- $data := default dict (get $secret "data") -}}
{{- range $key := list "tls.crt" "tls.key" -}}
{{- if empty (get $data $key) -}}
{{- fail (printf "external TLS secret %q in namespace %q is missing non-empty %q data" $secretName $namespace $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- define "lib.certificate" }}

{{- $name := index . 0 }}
{{- $dnsName := index . 1 }}
{{- $clusterIssuer := index . 2 }}
{{- $namespace := index . 3 }}
{{- $selfSigned := index . 4 }}
{{- $provider := default "cert-manager" (index . 5) }}
{{- $validateExternalSecret := default false (index . 6) }}

{{- if eq $provider "cert-manager" }}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ trimSuffix "-tls" $name }}"
  namespace: {{ $namespace }}
spec:
  {{- if $selfSigned }}
  {{/* spatz infrastructure needs CN to work */}}
  {{/* Let's encrypt certificates set the CN automatically */}}
  {{/* for self-signed certificates we need to set it explicitly */}}
  commonName: "{{ $dnsName }}"
  {{- end }}
  dnsNames:
    - "{{ $dnsName }}"
  issuerRef:
    kind: ClusterIssuer
    name: "{{ $clusterIssuer }}"
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256
    rotationPolicy: Always
  secretName: "{{ $name }}"
  subject: {}
  usages:
    - server auth
    - client auth

---

{{- else if eq $provider "external" }}
{{- if $validateExternalSecret }}
{{- include "lib.validateExternalTlsSecret" (list $name $namespace) }}
{{- end }}
{{- else }}
{{- fail (printf "unsupported certificates.provider %q; expected \"cert-manager\" or \"external\"" $provider) }}
{{- end }}

{{- end }}
