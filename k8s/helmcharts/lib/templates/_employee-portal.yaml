{{- define "lib.employeePortal" }}
---

{{ if .Values.employeeportal.enabled -}}

{{- $createDebugLogMount := include "createDebugLogMount" .Values }}

kind: Service
apiVersion: v1
metadata:
  name: employee-portal
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: employee-portal-app
  ports:
    - port: 443
      targetPort: spatz-incoming

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: employee-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: employee-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: employee-portal-app
  template:
    metadata:
      name: employee-portal
      labels:
        app: employee-portal-app
      annotations:
        kubectl.kubernetes.io/default-container: application
    spec:
      {{ if .Values.image.pullsecret -}}
      imagePullSecrets:
        - name: "{{ .Values.image.pullsecret }}"
      {{- end }}
      dnsConfig:
        nameservers:
          - 127.0.0.1
      securityContext: {{- .Values.podSecurityContext | toYaml | nindent 8 }}
      dnsPolicy: None
      initContainers:
      {{- include "waitForDeployment" (list .Values "employee-portal-auth") | indent 8 }}
      volumes:
        {{- if .Values.development.injectSelfSignedCA }}
        - name: ca
          configMap:
            name: ca
        {{- end }}
        {{- if eq "true" $createDebugLogMount }}
        - name: spatzdebuglog
          persistentVolumeClaim:
            claimName: employee-portal-spatz-debuglogs
        {{- end }}
      containers:
        - name: application
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/{{ default "employee-portal" .Values.employeeportal.imageName }}:{{ .Values.image.tag }}"
          securityContext: {{- .Values.containerSecurityContext | toYaml | nindent 12 }}
          resources:
          {{- toYaml (default dict .Values.employeeportalnextjs.resources) | nindent 12 }}
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: PUBLIC_ENVIRONMENT_TYPE
              value: "{{ include "deriveEnvironmentType" (.Values.spring.profiles.active) }}"
            - name: PUBLIC_FRONTEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}
            - name: PUBLIC_BASE_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/base
            - name: PUBLIC_AUDITLOG_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/auditlog
            - name: PUBLIC_OPENDATA_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/opendata
            - name: PUBLIC_SCHOOL_ENTRY_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/school-entry
            - name: PUBLIC_MEASLES_PROTECTION_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/measles-protection
            - name: PUBLIC_INSPECTION_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/inspection
            - name: PUBLIC_TRAVEL_MEDICINE_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/travel-medicine
            - name: PUBLIC_STATISTICS_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/statistics
            - name: PUBLIC_STI_PROTECTION_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/sti-protection
            - name: PUBLIC_MEDICAL_REGISTRY_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/medical-registry
            - name: PUBLIC_DENTAL_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/dental
            - name: PUBLIC_OFFICIAL_MEDICAL_SERVICE_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/official-medical-service
            - name: PUBLIC_MEDS_ABROAD_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/meds-abroad
            - name: PUBLIC_PROSTITUTE_PROTECTION_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/prostitute-protection
            - name: PUBLIC_CHAT_MANAGEMENT_BACKEND_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/chat-management
            - name: PUBLIC_PDF_CONVERTER_URL
              value: https://{{ .Values.domains.centralservices.pdfaconverterportal }}
            - name: PUBLIC_MATRIX_SERVER_URL
              value: https://{{ .Values.domains.hosts.employeeportal }}/api/synapse
            {{- range .Values.employeeportal.additionalEnv }}
            - name: {{ .name }}
              value: {{ .value }}
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
      {{- include "module.spatz" (dict "Values" $.Values "v" $.Values.employeeportalnextjs "k" "employeeportalnextjs" "relay" false "createDebugLogMount" $createDebugLogMount) }}

{{- if eq "true" $createDebugLogMount }}
  {{- include "lib.debuglogPvc" (list "employee-portal-spatz" .Values.employeeportal.debuglog $) }}
{{- end }}

{{- end}}

---
{{- end }}
