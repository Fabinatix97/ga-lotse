{{- define "lib.splitCertificates" }}

{{- $secretName := index . 0 }}
{{- $dnsName := index . 1 }}
{{- $clientCertIssuer := index . 2 }}
{{- $serverCertIssuer := index . 3 }}
{{- $namespace := index . 4 }}
{{- $selfSigned := index . 5 }}
{{- $provider := default "cert-manager" (index . 6) }}
{{- $validateExternalSecret := default false (index . 7) }}

{{- if eq $provider "cert-manager" }}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ trimSuffix "-tls" $secretName }}-client"
  namespace: {{ $namespace }}
spec:
  {{- if $selfSigned }}
  {{/* spatz infrastructure needs CN to work */}}
  {{/* Let's encrypt certificates set the CN automatically */}}
  {{/* for self-signed certificates we need to set it explicitly */}}
  commonName: "{{ $dnsName }}"
  {{- end }}
  dnsNames:
    - "{{ $dnsName }}"
  issuerRef:
    kind: ClusterIssuer
    name: {{ $clientCertIssuer }}
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256
    rotationPolicy: Always
  secretName: "{{ $secretName }}-client"
  subject: {}
  usages:
    - client auth

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ trimSuffix "-tls" $secretName }}-server"
  namespace: {{ $namespace }}
spec:
  {{- if $selfSigned }}
  {{/* spatz infrastructure needs CN to work */}}
  {{/* Let's encrypt certificates set the CN automatically */}}
  {{/* for self-signed certificates we need to set it explicitly */}}
  commonName: "{{ $dnsName }}"
  {{- end }}
  dnsNames:
    - "{{ $dnsName }}"
  issuerRef:
    kind: ClusterIssuer
    name: {{ $serverCertIssuer }}
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256
    rotationPolicy: Always
  secretName: "{{ $secretName }}-server"
  subject: {}
  usages:
    - server auth

---

{{- else if eq $provider "external" }}
{{- if $validateExternalSecret }}
{{- include "lib.validateExternalTlsSecret" (list (printf "%s-client" $secretName) $namspace) }}
{{- include "lib.validateExternalTlsSecret" (list (printf "%s-server" $secretName) $namspace) }}
{{- end }}
{{- else }}
{{- fail (printf "unsupported certificates.provider %q; expected \"cert-manager\" or \"external\"" $provider) }}
{{- end }}

{{- end }}
