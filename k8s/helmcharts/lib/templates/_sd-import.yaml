            {
              "readableName": "{{ include "readableName" (list $k) }}",
              "type": "{{ include "actorType" (list $k) }}",
              "active": true,
              "manualCertificate": false,
              "commonName": "{{ $k }}{{ $o.clusterLocalSuffix }}",
              "certificate": null,
              "networkId": "{{ $o.name }}"
            },
            {{- end }}
            {{- end }}
            {{- if include "includeActor" (list $o "employee-portal-auth") }}
