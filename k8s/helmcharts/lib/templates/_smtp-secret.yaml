{{- define "lib.smtpSecret" }}
{{- if not .Values.maildev.enabled }}
kind: Secret
apiVersion: v1
type: Opaque
data:
  smtp-username: "support@ga-lotse.de"
  smtp-password: {{ (default "chartsnap_test_value" (and .Values.env .Values.env.SMTP_PASSWORD)) | quote }}
  smtp-host: "smtp.mailbox.org"
  smtp-port: "465"
metadata:
  name: smtp-secrets
{{- end }}
{{- end }}
