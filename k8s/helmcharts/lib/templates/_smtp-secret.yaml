{{- define "lib.smtpSecret" }}
{{- if not .Values.maildev.enabled }}
kind: Secret
apiVersion: v1
type: Opaque
data:
  smtp-username: {{ (default "chartsnap_test_value" (and .Values.env .Values.env.SMTP_USERNAME)) | b64enc | quote }}
  smtp-password: {{ (default "chartsnap_test_value" (and .Values.env .Values.env.SMTP_PASSWORD)) | b64enc | quote }}
  smtp-host: {{ (default "chartsnap_test_value" (and .Values.env .Values.env.SMTP_HOST)) | b64enc | quote }}
  smtp-port: {{ (default "chartsnap_test_value" (and .Values.env .Values.env.SMTP_PORT)) | b64enc | quote }}
metadata:
  name: smtp-secrets
{{- end }}
{{- end }}
