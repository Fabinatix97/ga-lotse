{{- define "lib.rolebinding" }}
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-reader-role
  namespace: {{ $.Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
{{- if .Values.businessmoduleDefaults.database.k8sDeployment }}
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list"]
{{- end }}
---

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: default-list-deployments
  namespace: {{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-reader-role

{{ if .Values.deployerAdminRoleBinding.enabled -}}
---

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gitlab-ci-deployer-admin
  namespace: {{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: gitlab-ci-deployer
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin

{{- end }}

---
{{- end }}
