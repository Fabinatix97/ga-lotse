{{- define "lib.debuglogPvc" }}
{{- $name := index . 0 }}
{{- $settings := index . 1 }}
{{- $ := index . 2 }}

---

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ $name }}-debuglogs
  namespace: {{ $.Release.Namespace }}
  annotations:
    k8up.io/backup: 'false'
spec:
  accessModes: [ ReadWriteOnce ]
  {{- if $.Values.volumes.customStorageClass }}
  storageClassName: {{ $settings.class | default "rbd-storagepool-cluster" }}
  {{- end }}
  resources:
    requests:
      storage: {{ coalesce $settings.size "1Gi" }}

---
{{- end }}
