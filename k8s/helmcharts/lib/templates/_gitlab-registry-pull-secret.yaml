{{- define "lib.gitlabPullSecret" }}
{{ if (and .Values.image.pullsecret .Values.env .Values.env.GITLAB_REGISTRY_PULL_SECRET) -}}
kind: Secret
apiVersion: v1
type: kubernetes.io/dockerconfigjson
metadata:
  name: gitlab-registry-pull-secret
data:
  .dockerconfigjson: {{ .Values.env.GITLAB_REGISTRY_PULL_SECRET | b64enc | quote }}
{{- end}}
{{- end}}
