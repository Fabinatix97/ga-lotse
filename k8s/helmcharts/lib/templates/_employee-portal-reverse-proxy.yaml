{{- define "lib.employeePortalReverseProxy" }}
---

{{ if .Values.employeeportal.enabled -}}

{{- $createDebugLogMount := include "createDebugLogMount" .Values }}

kind: Service
apiVersion: v1
metadata:
  name: employee-portal-reverse-proxy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: employee-portal-reverse-proxy-app
  ports:
    - port: 443
      name: proxy-incoming
      targetPort: proxy-incoming

---
{{ include "lib.certificate" (list .Values.employeeportal.certificate.secret .Values.domains.hosts.employeeportal .Values.domains.clusterIssuer .Release.Namespace .Values.development.injectSelfSignedCA) }}
{{ include "ingress" (list "employee-portal" .Values.ingress.type .Values.domains.hosts.employeeportal "proxy-incoming" "employee-portal-reverse-proxy" .Release.Namespace)}}

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: employee-portal-reverse-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: employee-portal-reverse-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: employee-portal-reverse-proxy-app
  template:
    metadata:
      name: employee-portal-reverse-proxy
      labels:
        app: employee-portal-reverse-proxy-app
      annotations:
        checksum/config: {{ include "lib.employeePortalReverseProxyConfig" . | sha256sum }}
        kubectl.kubernetes.io/default-container: application
    spec:
      {{ if .Values.image.pullsecret -}}
      imagePullSecrets:
        - name: "{{ .Values.image.pullsecret }}"
      {{- end }}
      dnsConfig:
        nameservers:
          - 127.0.0.1
      dnsPolicy: None
      securityContext: {{- .Values.podSecurityContext | toYaml | nindent 8 }}
      initContainers:
      {{- include "waitForDeployment" (list .Values "employee-portal-auth") | indent 8 }}
      containers:
        - name: application
          {{- include "getThirdPartyImage" .Values.thirdPartyImages.nginx | indent 10 }}
          securityContext: {{- .Values.containerSecurityContext | toYaml | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 443
          resources:
          {{- toYaml (default dict .Values.employeeportal.resources) | nindent 12 }}
          ports:
            - containerPort: 443
              protocol: TCP
              name: proxy-incoming
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: config
              subPath: employee-portal.conf
              readOnly: true
            - mountPath: /etc/nginx/auth_request.conf
              name: config
              subPath: auth_request.conf
              readOnly: true
            - mountPath: /etc/nginx/auth_api_request.conf
              name: config
              subPath: auth_api_request.conf
              readOnly: true
            - mountPath: /etc/nginx/nginx.conf
              name: config
              subPath: nginx.conf
              readOnly: true
            - mountPath: /etc/nginx/forward_headers.conf
              name: config
              subPath: forward_headers.conf
              readOnly: true
            - mountPath: /var/cache/nginx
              subPath: cache
              name: nginx-runtime-data
            - mountPath: /var/run
              subPath: var-run
              name: nginx-runtime-data
            - name: certs
              mountPath: /etc/nginx/ssl/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: certs
              mountPath: /etc/nginx/ssl/tls.key
              subPath: tls.key
              readOnly: true
{{- $epHost := printf "employee-portal%s" .Values.domains.clusterLocalSuffix }}
{{- $epAuthHost := printf "employee-portal-auth%s" .Values.domains.clusterLocalSuffix }}
{{- include "module.spatz" (dict "Values" $.Values "v" $.Values.employeeportal "k" "employeeportal" "actorType" "WEB" "additionalDnsHosts" (list $epHost $epAuthHost) "inbound" false "relay" false "createDebugLogMount" $createDebugLogMount) }}
      volumes:
        {{- if .Values.development.injectSelfSignedCA }}
        - name: ca
          configMap:
            name: ca
        {{- end }}
        - name: config
          configMap:
            name: employee-portal-reverse-proxy-config
        - name: certs
          secret:
            secretName: {{ .Values.employeeportal.certificate.secret }}
            defaultMode: 420
        - name: nginx-runtime-data
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        {{- if eq "true" $createDebugLogMount }}
        - name: spatzdebuglog
          persistentVolumeClaim:
            claimName: employee-portal-reverse-proxy-spatz-debuglogs
        {{- end }}

{{- if eq "true" $createDebugLogMount }}
  {{- include "lib.debuglogPvc" (list "employee-portal-reverse-proxy-spatz" .Values.employeeportal.debuglog $) }}
{{- end }}

{{- end }}

---
{{- end }}
