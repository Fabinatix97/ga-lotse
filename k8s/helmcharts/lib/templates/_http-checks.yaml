{{- define "http-checks" }}

{{- $host := .Values.domains.hosts.citizenportal }}
{{- $kcHost := .Values.domains.hosts.keycloak }}
{{- $epHost := .Values.domains.hosts.employeeportal }}
---
kind : Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: http-checks
  namespace: {{ .Release.Namespace }}
spec:
  module: http_200
  prober:
    url: {{ .Values.monitoring.httpChecks.blackboxExporterAddress | quote }}
  targets:
    staticConfig:
      static:
        {{ if .Values.businessmodules.base.enabled }}
        - "https://{{ $host }}/api/base/public/department/info"
        {{ end}}
        {{ if .Values.businessmodules.schoolentry.enabled }}
        - "https://{{ $host }}/api/school-entry/citizen/public/opening-hours"
        {{ end}}
        {{ if .Values.businessmodules.travelmedicine.enabled }}
        - "https://{{ $host }}/api/travel-medicine/citizen/public/opening-hours"
        {{ end}}
        {{ if .Values.keycloak.enabled }}
        - "https://{{ $kcHost }}"
        {{ end}}
        {{ if .Values.employeeportal.enabled }}
        - "https://{{ $epHost }}"
        {{ end}}
{{- end }}
