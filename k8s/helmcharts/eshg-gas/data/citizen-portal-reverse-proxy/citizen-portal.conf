server {
  resolver 127.0.0.1 valid=15s ipv6=off; # force resolving cache to localhost
  listen       443 ssl;
  http2        on;
  server_name  {{ .Values.domains.hosts.citizenportal }};

  if ($host != "{{ .Values.domains.hosts.citizenportal }}") {
    return 400;
  }

  # Path to the server certificates
  ssl_certificate /etc/nginx/ssl/tls.crt;
  ssl_certificate_key /etc/nginx/ssl/tls.key;

  ssl_session_cache shared:SSL:1m;
  ssl_session_timeout 5m;
  ssl_session_tickets off;

  # curl https://ssl-config.mozilla.org/ffdhe4096.txt > dhparam
  ssl_dhparam /etc/nginx/ssl/dhparam;

  # https://ssl-config.mozilla.org/#server=nginx&version=1.17.7&config=intermediate&openssl=1.1.1k&guideline=5.7
  # intermediate configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ecdh_curve X25519:prime256v1:secp384r1;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_conf_command Ciphersuites  TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;

  # HSTS (ngx_http_headers_module is required) (63072000 seconds)
  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security "max-age=63072000; includeSubdomains" always;

  proxy_set_header x-eshg-host "";

  # access_log  /proc/self/fd/2  main;

  location = /auth/keycloak {
    include forward_headers.conf;
    set $targetHostName http://citizen-portal-auth{{ .Values.domains.clusterLocalSuffix }}/auth/keycloak;
    proxy_pass $targetHostName;
  }

  location ~ /auth/login/keycloak.* {
    include forward_headers.conf;
    set $targetHostName http://citizen-portal-auth{{ .Values.domains.clusterLocalSuffix }}/auth/login/keycloak;
    proxy_pass $targetHostName$is_args$args;
    # use only absolute path from upstream redirect location
    # since auth module returns its own internal hostname :/
    proxy_redirect ~^https?://[^/]+(.*)$ $1;
  }

  location = /logout/keycloak {
    set $targetHostName http://citizen-portal-auth{{ .Values.domains.clusterLocalSuffix }}/logout/keycloak;
    proxy_pass $targetHostName;
  }

  location = /logout {
    include forward_headers.conf;
    set $targetHostName http://citizen-portal-auth{{ .Values.domains.clusterLocalSuffix }}/logout;
    proxy_pass $targetHostName;
  }

  location = /browser-aktualisieren {
    set $targetHostName http://citizen-portal-auth{{ .Values.domains.clusterLocalSuffix }}/browser_update_required.html;
    proxy_pass $targetHostName;
  }

  location = /login-error {
    set $targetHostName http://citizen-portal-auth{{ .Values.domains.clusterLocalSuffix }}/login_error.html;
    proxy_pass $targetHostName;
  }

  # No authorization required for the Department API
  location /api/base/public/department/ {
    set $targetHostName base{{ .Values.domains.clusterLocalSuffix }};
    # rewrite is needed for dynamic host resolving to work with nginx community version
    # https://stackoverflow.com/questions/33218367/nginx-proxy-pass-remove-path-prefix-resolve-dns
    rewrite ^/api/base/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }

  # No authorization required for the Config API
  location = /api/base/public/config {
    set $targetHostName http://base{{ .Values.domains.clusterLocalSuffix }}/public/config;
    proxy_pass $targetHostName;
  }

  # No authorization required for the base feature toggles API
  location = /api/base/feature-toggles {
    set $targetHostName http://base{{ .Values.domains.clusterLocalSuffix }}/feature-toggles;
    proxy_pass $targetHostName;
  }

  location /api/base/ {
    set $targetHostName base{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/base/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }

  {{- if .Values.businessmodules.inspection.enabled }}
  location /api/inspection/gdpr-validation-tasks/ {
    set $targetHostName inspection{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/inspection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.schoolentry.enabled }}
  location /api/school-entry/citizen/public/ {
    set $targetHostName schoolentry{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/school-entry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/school-entry/citizen/auth/ {
    set $targetHostName schoolentry{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/school-entry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/school-entry/gdpr-validation-tasks/ {
    set $targetHostName schoolentry{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/school-entry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.travelmedicine.enabled }}
  # No authorization required for the CitizenPublicController; limit the rate at which consultations can be saved
  location /api/travel-medicine/citizen/public/vaccination-consultations {
    limit_req zone=tm_citizen_procedure;
    limit_req_status 429;
    limit_req_log_level warn;
    set $targetHostName travelmedicine{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/travel-medicine/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/travel-medicine/citizen/public/ {
    set $targetHostName travelmedicine{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/travel-medicine/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/travel-medicine/citizen/auth/ {
    set $targetHostName travelmedicine{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/travel-medicine/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/travel-medicine/gdpr-validation-tasks/ {
    set $targetHostName travelmedicine{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/travel-medicine/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.measlesprotection.enabled }}
  # Limit the rate at which measles reports can be submitted
  location /api/measles-protection/organisations/report {
    limit_req zone=organisations_report;
    limit_req_status 429;
    limit_req_log_level warn;
    set $targetHostName measlesprotection{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/measles-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }

  # No authorization required for the MeaslesProtectionApi
  location /api/measles-protection/organisation {
    set $targetHostName measlesprotection{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/measles-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }

  location /api/measles-protection/gdpr-validation-tasks/ {
    set $targetHostName measlesprotection{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/measles-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.officialmedicalservice.enabled }}
  location /api/official-medical-service/citizen-public/ {
    set $targetHostName officialmedicalservice{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/official-medical-service/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/official-medical-service/citizen-auth/ {
    set $targetHostName officialmedicalservice{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/official-medical-service/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/official-medical-service/gdpr-validation-tasks/ {
    set $targetHostName officialmedicalservice{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/official-medical-service/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.stiprotection.enabled }}
  location /api/sti-protection/gdpr-validation-tasks/ {
    set $targetHostName stiprotection{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/sti-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/sti-protection/citizen/public/ {
    set $targetHostName stiprotection{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/sti-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  location /api/sti-protection/citizen/auth/ {
    set $targetHostName stiprotection{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/sti-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.medicalregistry.enabled }}
  # No authorization required for the public endpoint
  location /api/medical-registry/public/ {
    set $targetHostName medicalregistry{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/medical-registry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  # No authorization required for the public endpoint
  location = /api/medical-registry/medical-registry-entries/public {
    set $targetHostName medicalregistry{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/medical-registry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  # No authorization required for the medical registry feature toggles endpoint
  location = /api/medical-registry/feature-toggles {
    set $targetHostName http://medicalregistry{{ .Values.domains.clusterLocalSuffix }}/feature-toggles;
    proxy_pass $targetHostName;
  }
  location /api/medical-registry/gdpr-validation-tasks/ {
    set $targetHostName medicalregistry{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/medical-registry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.opendata.enabled }}
    # No authorization required for the public endpoint
  location /api/opendata/citizen/public {
    set $targetHostName opendata{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/opendata/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  # No authorization required for the opendata feature toggles endpoint
  location = /api/opendata/feature-toggles {
    set $targetHostName http://opendata{{ .Values.domains.clusterLocalSuffix }}/feature-toggles;
    proxy_pass $targetHostName;
  }
  {{- end }}

  {{- if .Values.businessmodules.dental.enabled }}
  location /api/dental/gdpr-validation-tasks/ {
    set $targetHostName dental{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/dental/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.medsabroad.enabled }}
  location /api/meds-abroad/citizen/public/ {
    set $targetHostName medsabroad{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/meds-abroad/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  # handle disabled backends as 404
  # note: all /api/ routes must appear before this
  location /api/ {
    return 404;
  }

  # See https://cronn-gmbh.atlassian.net/browse/ISSUE-3660
  location = /esu {
    return 301 /einschulungsuntersuchung$is_args$args;
  }

  location = /sti {
    return 301 /sexuelle-gesundheit/sti-beratung$is_args$args;
  }

  location = /sab {
    return 301 /sexuelle-gesundheit/sexarbeit$is_args$args;
  }

  # No authentication for specific pages
  location ~ ^/(|_next/static/.+|einschulungsuntersuchung)$ {
    set $targetHostName citizen-portal{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$targetHostName;
  }

  # No authentication needed for security.txt
  location = /.well-known/security.txt {
    set $targetHostName base{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$targetHostName/public/department/security-txt;
  }
  location = /pgp-key.txt {
    set $targetHostName base{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$targetHostName/public/department/security-txt-public-key;
  }

  # No authentication for static stuff
  location /_next/static/ {
    set $targetHostName citizen-portal{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$targetHostName;
  }

  # Until default auth is turned on protect module routes
  location ~ ^/((en|de)/)?(einschulungsuntersuchung/.+|(?:unternehmen/)?mein-bereich/.+|impfberatung/meine-termine(?:/.+)?|sexuelle-gesundheit/mein-bereich(?:/.+)?|amtsaerztlicherdienst/mein-bereich(?:/.+)?)$ {
    include auth_request.conf;

    auth_request_set $resolved_location $upstream_http_location;
    auth_request_set $auth_cookie $upstream_http_set_cookie;

    error_page 401 = @handle_redirect;

    set $targetHostName citizen-portal{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$targetHostName;
  }

  {{- if not .Values.frontend.playground.enabled }}
  # Prevent access to frontend playground
  location /playground {
      return 404;
  }
  {{- end }}

  location / {
    # Default authentication requirement dropped until integration with MyUnternehmensKonto is complete
    # include auth_request.conf;

    # auth_request_set $resolved_location $upstream_http_location;
    # auth_request_set $auth_cookie $upstream_http_set_cookie;

    # error_page 401 = @handle_redirect;

    set $targetHostName http://citizen-portal{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass $targetHostName;
  }

  location @handle_redirect {
    add_header Set-Cookie $auth_cookie;

    # use only absolute path from upstream redirect location
    # since auth module returns its own internal hostname :/
    if ($resolved_location ~ "^https?://[^/]+(.*)") {
      set $resolved_location $1;
    }

    return 302 $resolved_location;
  }

  location = /auth {
    internal;

    include forward_headers.conf;
    set $authTargetHost citizen-portal-auth{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$authTargetHost/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header X-Original-URI     $request_uri;
    proxy_set_header X-Original-Method  $request_method;
    proxy_set_header X-Correlation-ID   $request_id;

    proxy_intercept_errors on;
    error_page 302 = @rewrite_302_to_401;
  }

  # Deny access to hidden files.
  location ~/\.{
      deny all;
  }

  # Unfortunately, Nginx does not allow to return a 302 in an auth_request.
  # So we workaround by temporarily rewriting it to 401
  location @rewrite_302_to_401 {
    return 401;
  }

  # specify a custom error page for all common HTTP errors
  error_page
      400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
      500 501 502 503 504 505 507
      @errors;

  # location block for our custom error page
  location @errors {
      internal;
      default_type "text/html; charset=utf-8";
      return 200 '
              <!DOCTYPE html>
              <html lang="en">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Error</title>
                  <style>
                      body { font-family: Arial, sans-serif; text-align: center; }
                      .error-container { margin-top: 50px; }
                  </style>
              </head>
              <body>
                  <div class="error-container">
                      <h1>Oh-weh! Da ging etwas schief.</h1>
                      <p>Wir haben technische Schwierigkeiten. Bitte versuchen Sie es sp&auml;ter noch einmal.</p>
                  </div>
                  <div class="error-container">
                      <h1>Oops! Something went wrong.</h1>
                      <p>We\'re experiencing technical difficulties. Please try again later.</p>
                  </div>
              </body>
              </html>
          ';
  }
}
