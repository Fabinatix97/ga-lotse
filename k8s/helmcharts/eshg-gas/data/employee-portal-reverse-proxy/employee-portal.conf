server {
  resolver 127.0.0.1 valid=15s ipv6=off; # force resolving cache to localhost
  listen       443 ssl;
  http2        on;
  server_name  {{ .Values.domains.hosts.employeeportal }};

  if ($host != "{{ .Values.domains.hosts.employeeportal }}") {
    return 400;
  }

  # Path to the server certificates
  ssl_certificate /etc/nginx/ssl/tls.crt;
  ssl_certificate_key /etc/nginx/ssl/tls.key;

  ssl_session_cache shared:SSL:1m;
  ssl_session_timeout 5m;
  ssl_session_tickets off;

  # https://ssl-config.mozilla.org/#server=nginx&version=1.27.4&config=modern&openssl=3&guideline=5.7
  # modern configuration
  ssl_protocols TLSv1.3;
  ssl_ecdh_curve X25519:prime256v1:secp384r1;
  ssl_prefer_server_ciphers off;
  ssl_conf_command Ciphersuites  TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;

  # HSTS (ngx_http_headers_module is required) (63072000 seconds)
  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security "max-age=63072000; includeSubdomains" always;

  proxy_set_header x-eshg-host "";

  # access_log  /proc/self/fd/2  main;

  location = /auth/keycloak {
    include forward_headers.conf;
    set $targetHostName http://employee-portal-auth{{ .Values.domains.clusterLocalSuffix }}/auth/keycloak;
    proxy_pass $targetHostName;
  }

  location ~ /auth/login/keycloak.* {
    include forward_headers.conf;
    set $targetHostName http://employee-portal-auth{{ .Values.domains.clusterLocalSuffix }}/auth/login/keycloak;
    proxy_pass $targetHostName$is_args$args;
    # use only absolute path from upstream redirect location
    # since auth module returns its own internal hostname :/
    proxy_redirect ~^https?://[^/]+(.*)$ $1;
  }

  location = /logout/keycloak {
    set $targetHostName http://employee-portal-auth{{ .Values.domains.clusterLocalSuffix }}/logout/keycloak;
    proxy_pass $targetHostName;
  }

  location = /logout {
    include forward_headers.conf;
    set $targetHostName http://employee-portal-auth{{ .Values.domains.clusterLocalSuffix }}/logout;
    proxy_pass $targetHostName;
  }

  location = /browser-aktualisieren {
    set $targetHostName http://employee-portal-auth{{ .Values.domains.clusterLocalSuffix }}/browser_update_required.html;
    proxy_pass $targetHostName;
  }

  location = /login-error {
    set $targetHostName http://employee-portal-auth{{ .Values.domains.clusterLocalSuffix }}/login_error.html;
    proxy_pass $targetHostName;
  }

  location /api/base/ {
    set $targetHostName base{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/base/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }

  {{- if .Values.auditlog.enabled }}
  location /api/auditlog/ {
    set $targetHostName auditlog{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/auditlog/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.inspection.enabled }}
  location /api/inspection/ {
    set $targetHostName inspection{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/inspection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.schoolentry.enabled }}
  location ~ /api/school-entry/import/(citizen|school|past-procedure)-list {
    set $targetHostName schoolentry{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/school-entry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
    proxy_read_timeout 120;
  }
  location /api/school-entry/vaccination-check {
    return 404;
  }
  location /api/school-entry/ {
    set $targetHostName schoolentry{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/school-entry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.travelmedicine.enabled }}
  location /api/travel-medicine/ {
    set $targetHostName travelmedicine{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/travel-medicine/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.measlesprotection.enabled }}
  location /api/measles-protection/ {
    set $targetHostName measlesprotection{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/measles-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.statistics.enabled }}
  location /api/statistics/ {
    set $targetHostName statistics{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/statistics/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.opendata.enabled }}
  location /api/opendata/ {
    set $targetHostName opendata{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/opendata/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.chatmanagement.enabled }}
  location /api/chat-management/ {
    set $targetHostName chatmanagement{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/chat-management/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.stiprotection.enabled }}
  location /api/sti-protection/ {
    set $targetHostName stiprotection{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/sti-protection/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.medsabroad.enabled }}
  location /api/meds-abroad/ {
    set $targetHostName medsabroad{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/meds-abroad/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.medicalregistry.enabled }}
  location ~ /api/medical-registry/import {
    set $targetHostName medicalregistry{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/medical-registry/(.*) /$1 break;
    proxy_pass http://$targetHostName$uri$is_args$args;
    proxy_read_timeout 300;
  }
  location /api/medical-registry/ {
    set $targetHostName medicalregistry{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/medical-registry/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.dental.enabled }}
  location /api/dental/children/import/ {
    set $targetHostName dental{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/dental/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
    proxy_read_timeout 120;
  }
  location /api/dental/ {
    set $targetHostName dental{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/dental/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.officialmedicalservice.enabled }}
  location /api/official-medical-service/ {
    set $targetHostName officialmedicalservice{{ .Values.domains.clusterLocalSuffix }};
    include auth_api_request.conf;
    rewrite ^/api/official-medical-service/(.*) /$1  break;
    proxy_pass http://$targetHostName$uri$is_args$args;
  }
  {{- end }}

  {{- if .Values.businessmodules.chatmanagement.enabled }}
  # There is no need to expose synapse admin api to outside world
  location /api/synapse/_synapse/admin {
      return 404;
  }

  location /api/synapse/ {
    auth_request /synapse-auth;
    auth_request_set $resolved_authorization $upstream_http_authorization;
    proxy_set_header Authorization    $resolved_authorization;

    set $targetHostName synapse{{ .Values.domains.clusterLocalSuffix }};
    rewrite ^/api/synapse/(.*) /$1 break;

    # note: do not add a path (even a single /) after the port in `proxy_pass`,
    # otherwise nginx will canonicalise the URI and cause signature verification
    # errors.
    proxy_pass http://$targetHostName$uri$is_args$args;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host {{ .Values.domains.hosts.employeeportal }}/api/synapse; # This value must match Synapse's public_baseurl in homeserver.template - otherwise synapse /login endpoint gets into "URL is not canonical" redirect death loop...
    proxy_set_header x-eshg-host $targetHostName; # This enforces spatz to ignore 'Host' header value and use this one instead for its routing

    # Nginx by default only allows file uploads up to 1M in size
    # Increase client_max_body_size to match max_upload_size defined in homeserver.yaml
    client_max_body_size 10M;

    # Synapse responses may be chunked, which is an HTTP/1.1 feature.
    proxy_http_version 1.1;
  }

  {{- end }}

  # handle disabled backends as 404
  # note: all /api/ routes must appear before this
  location /api/ {
    return 404;
  }

  # No authentication needed for security.txt
  location = /.well-known/security.txt {
    set $targetHostName base{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$targetHostName/public/department/security-txt;
  }
  location = /pgp-key.txt {
    set $targetHostName base{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$targetHostName/public/department/security-txt-public-key;
  }

  {{- if not .Values.frontend.playground.enabled }}
  # Prevent access to frontend playground
  location /playground {
      return 404;
  }
  {{- end }}

  location / {
    include auth_request.conf;

    auth_request_set $resolved_location $upstream_http_location;
    auth_request_set $auth_cookie $upstream_http_set_cookie;

    error_page 401 = @handle_redirect;

    set $targetHostName http://employee-portal{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass $targetHostName;
  }

  location @handle_redirect {
    add_header Set-Cookie $auth_cookie;

    # use only absolute path from upstream redirect location
    # since auth module returns its own internal hostname :/
    if ($resolved_location ~ "^https?://[^/]+(.*)") {
      set $resolved_location $1;
    }

    return 302 $resolved_location;
  }

  location = /auth {
    internal;

    include forward_headers.conf;
    set $authTargetHost employee-portal-auth{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$authTargetHost/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header X-Original-URI     $request_uri;
    proxy_set_header X-Original-Method  $request_method;
    proxy_set_header X-Correlation-ID   $request_id;

    proxy_intercept_errors on;
    error_page 302 = @rewrite_302_to_401;
  }

  location = /synapse-auth {
    internal;

    include forward_headers.conf;
    set $authTargetHost employee-portal-auth{{ .Values.domains.clusterLocalSuffix }};
    proxy_pass http://$authTargetHost/synapse;
    proxy_pass_request_body off;

    proxy_set_header Content-Length "";
  }

  # Deny access to hidden files.
  location ~/\.{
      deny all;
  }

  # Unfortunately, Nginx does not allow to return a 302 in an auth_request.
  # So we workaround by temporarily rewriting it to 401
  location @rewrite_302_to_401 {
    return 401;
  }

  # specify a custom error page for all common HTTP errors
  error_page
      400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
      500 501 502 503 504 505 507
      @errors;

  # location block for our custom error page
  location @errors {
      internal;
      default_type "text/html; charset=utf-8";
      return 200 '
              <!DOCTYPE html>
              <html lang="en">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Error</title>
                  <style>
                      body { font-family: Arial, sans-serif; text-align: center; }
                      .error-container { margin-top: 50px; }
                  </style>
              </head>
              <body>
                  <div class="error-container">
                      <h1>Oh-weh! Da ging etwas schief.</h1>
                      <p>Wir haben technische Schwierigkeiten. Bitte versuchen Sie es sp&auml;ter noch einmal.</p>
                  </div>
                  <div class="error-container">
                      <h1>Oops! Something went wrong.</h1>
                      <p>We\'re experiencing technical difficulties. Please try again later.</p>
                  </div>
              </body>
              </html>
          ';
  }
}
