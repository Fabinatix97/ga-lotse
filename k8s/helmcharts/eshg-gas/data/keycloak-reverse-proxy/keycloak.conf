server {
  resolver 127.0.0.1 valid=15s ipv6=off; # force resolving cache to localhost
{{- if (eq "traefik" .Values.ingress.type) }}
  listen       443 ssl proxy_protocol;
  real_ip_header proxy_protocol;
  set_real_ip_from {{ .Values.ingress.internalIpRange }};
{{- end }}
{{- if (eq "openshift" .Values.ingress.type) }}
  listen       443 ssl;
{{- end }}
  http2        on;
  server_name  {{ .Values.domains.hosts.keycloak }};

  if ($host != "{{ .Values.domains.hosts.keycloak }}") {
    return 400;
  }

  proxy_ssl_server_name on;

  # access_log  /proc/self/fd/2  main;

  # Path to the server certificates
  ssl_certificate /etc/nginx/ssl/tls.crt;
  ssl_certificate_key /etc/nginx/ssl/tls.key;

  ssl_session_cache shared:SSL:1m;
  ssl_session_timeout 5m;
  ssl_session_tickets off;

  # https://ssl-config.mozilla.org/#server=nginx&version=1.27.4&config=modern&openssl=3&guideline=5.7
  # modern configuration
  ssl_protocols TLSv1.3;
  ssl_ecdh_curve X25519:prime256v1:secp384r1;
  ssl_prefer_server_ciphers off;
  ssl_conf_command Ciphersuites  TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;

  # HSTS (ngx_http_headers_module is required) (63072000 seconds)
  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security "max-age=63072000; includeSubdomains" always;

  location /js/ {
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/;
  }

  location /resources/ {
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/resources/;
  }

  location = /robots.txt {
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/robots.txt;
  }

  location = / {
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/;
  }

  location = /admin/ {
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/admin/;
  }

  location = /admin/serverinfo {
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/admin/serverinfo;
  }

  location /admin/master/console/ {
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/admin/master/console/;
  }

  location /admin/realms/ {
      # Do NOT use a trailing slash here, to proxy_pass the *encoded* url
      # since e.g. role names (incl. special chars like '[' and ']') can be part of the path!
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }};
  }

  location /realms/master/ {
      include forward_headers.conf;
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/realms/master/;
  }

  location /realms/citizens/ {
      include forward_headers.conf;
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/realms/citizens/;
  }

  location /realms/eshg/ {
      include forward_headers.conf;
      proxy_pass https://{{ .Values.domains.hosts.keycloakInternal }}/realms/eshg/;
  }


 # specify a custom error page for all common HTTP errors
  error_page
      400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
      500 501 502 503 504 505 507
      @errors;

  # location block for our custom error page
  location @errors {
      internal;
      default_type "text/html; charset=utf-8";
      return 200 '
              <!DOCTYPE html>
              <html lang="en">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Error</title>
                  <style>
                      body { font-family: Arial, sans-serif; text-align: center; }
                      .error-container { margin-top: 50px; }
                  </style>
              </head>
              <body>
                  <div class="error-container">
                      <h1>Oh-weh! Da ging etwas schief.</h1>
                      <p>Wir haben technische Schwierigkeiten. Bitte versuchen Sie es sp&auml;ter noch einmal.</p>
                  </div>
                  <div class="error-container">
                      <h1>Oops! Something went wrong.</h1>
                      <p>We\'re experiencing technical difficulties. Please try again later.</p>
                  </div>
              </body>
              </html>
          ';
  }
}

server {
    listen 8080;
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}
