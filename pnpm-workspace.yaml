packages:
  - "e2e"
  - "performance-test"
  - "apps/*"
  - "packages/*"

catalogs:
  next:
    "next": "15.4.5"
    "@next/bundle-analyzer": "15.4.5"
    "eslint-config-next": "15.4.5"

  react:
    "react": "19.1.1"
    "@types/react": "19.1.9"
    "react-dom": "19.1.1"
    "@types/react-dom": "19.1.7"

  joy:
    "@mui/joy": "5.0.0-beta.52"
    "@mui/icons-material": "5.17.1"
    "@mui/material": "npm:@mui/joy@5.0.0-beta.52"
    "@emotion/cache": "11.14.0"
    "@emotion/react": "11.14.0"
    "@emotion/styled": "11.14.1"
    "@fontsource/poppins": "5.2.6"
    "@fontsource/source-code-pro": "5.2.6"

  i18next:
    "i18next": "25.3.2"
    "i18next-resources-to-backend": "1.2.1"
    "react-i18next": "15.6.1"

  fullcalendar:
    "@fullcalendar/core": "6.1.18"
    "@fullcalendar/daygrid": "6.1.18"
    "@fullcalendar/interaction": "6.1.18"
    "@fullcalendar/list": "6.1.18"
    "@fullcalendar/react": "6.1.18"
    "@fullcalendar/timegrid": "6.1.18"

  eslint:
    "eslint": "9.32.0"
    "typescript-eslint": "8.39.0"
    "@eslint/compat": "1.3.1"
    "@eslint/eslintrc": "3.3.1"
    "@eslint/js": "9.32.0"
    "eslint-config-prettier": "10.1.8"
    "eslint-plugin-import": "2.32.0"
    "eslint-plugin-unused-imports": "4.1.4"
    "eslint-plugin-promise": "7.2.1"

  prettier:
    "prettier": "3.6.2"
    "@trivago/prettier-plugin-sort-imports": "5.2.2"

  vite:
    "vite": "7.0.5"

  vitest:
    "vitest": "3.2.4"
    "@vitest/coverage-istanbul": "3.2.4"
    "@vitejs/plugin-react": "4.7.0"
    "vite-tsconfig-paths": "5.1.4"
    "@cronn/vitest-file-snapshots": "0.10.1"

  playwright:
    "@playwright/test": "1.54.2"
    "@axe-core/playwright": "4.10.2"
    "axe-core": "4.10.3"
    "axe-html-reporter": "2.2.11"
    "@cronn/playwright-file-snapshots": "0.10.0"

  common:
    "typescript": "5.9.2"
    "@types/node": "24.2.0"
    "@tanstack/react-query": "5.84.1"
    "@tanstack/eslint-plugin-query": "5.83.1"
    "@tanstack/react-table": "8.21.3"
    "date-fns": "4.1.0"
    "formik": "2.4.6"
    "react-error-boundary": "6.0.0"
    "remeda": "2.28.0"
    "valibot": "1.1.0"
    "use-debounce": "10.0.5"
    "uuid": "11.1.0"
    "drauu": "0.4.3"
    "tsup": "8.5.0"
    "zustand": "5.0.7"
    "@keycloak/keycloak-admin-client": "26.3.2"

    "tsx": "4.20.3"
    "pdf-parse-new": "1.4.1"

# add new dependencies with exact version instead of semver ranges
saveExact: true
# do not use symlinks because they cause issues on Windows system
# see https://github.com/vercel/next.js/issues/50803
nodeLinker: "hoisted"
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - "@appthreat/sqlite3"
  - unrs-resolver
