packages:
  - "e2e"
  - "performance-test"
  - "apps/*"
  - "packages/*"

catalogs:
  next:
    "next": "15.5.2"
    "@next/bundle-analyzer": "15.5.2"
    "eslint-config-next": "15.5.2"

  react:
    "react": "19.1.1"
    "@types/react": "19.1.12"
    "react-dom": "19.1.1"
    "@types/react-dom": "19.1.9"

  joy:
    "@mui/joy": "5.0.0-beta.52"
    "@mui/icons-material": "5.17.1"
    "@mui/material": "npm:@mui/joy@5.0.0-beta.52"
    "@emotion/cache": "11.14.0"
    "@emotion/react": "11.14.0"
    "@emotion/styled": "11.14.1"
    "@fontsource/poppins": "5.2.6"
    "@fontsource/source-code-pro": "5.2.6"

  i18next:
    "i18next": "25.4.2"
    "i18next-resources-to-backend": "1.2.1"
    "react-i18next": "15.7.3"

  fullcalendar:
    "@fullcalendar/core": "6.1.19"
    "@fullcalendar/daygrid": "6.1.19"
    "@fullcalendar/interaction": "6.1.19"
    "@fullcalendar/list": "6.1.19"
    "@fullcalendar/react": "6.1.19"
    "@fullcalendar/timegrid": "6.1.19"

  eslint:
    "eslint": "9.34.0"
    "typescript-eslint": "8.42.0"
    "@eslint/compat": "1.3.2"
    "@eslint/eslintrc": "3.3.1"
    "@eslint/js": "9.34.0"
    "eslint-config-prettier": "10.1.8"
    "eslint-plugin-import": "2.32.0"
    "eslint-plugin-unused-imports": "4.2.0"
    "eslint-plugin-promise": "7.2.1"

  prettier:
    "prettier": "3.6.2"
    "@trivago/prettier-plugin-sort-imports": "5.2.2"

  vite:
    "vite": "7.1.4"

  vitest:
    "vitest": "3.2.4"
    "@vitest/coverage-istanbul": "3.2.4"
    "@vitejs/plugin-react": "5.0.2"
    "vite-tsconfig-paths": "5.1.4"
    "@cronn/vitest-file-snapshots": "0.13.0"

  playwright:
    "@playwright/test": "1.55.0"
    "@axe-core/playwright": "4.10.2"
    "axe-core": "4.10.3"
    "axe-html-reporter": "2.2.11"
    "@cronn/playwright-file-snapshots": "0.15.0"

  common:
    "typescript": "5.9.2"
    "@types/node": "22.18.0"
    "@tanstack/react-query": "5.85.8"
    "@tanstack/eslint-plugin-query": "5.83.1"
    "@tanstack/react-table": "8.21.3"
    "date-fns": "4.1.0"
    "formik": "2.4.6"
    "react-error-boundary": "6.0.0"
    "remeda": "2.30.0"
    "valibot": "1.1.0"
    "use-debounce": "10.0.6"
    "uuid": "11.1.0"
    "drauu": "0.4.3"
    "tsup": "8.5.0"
    "zustand": "5.0.8"
    "@keycloak/keycloak-admin-client": "26.3.3"

    "tsx": "4.20.5"
    "pdf-parse-new": "1.4.1"

# add new dependencies with exact version instead of semver ranges
saveExact: true
# do not use symlinks because they cause issues on Windows system
# see https://github.com/vercel/next.js/issues/50803
nodeLinker: "hoisted"
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - "@appthreat/sqlite3"
  - unrs-resolver
