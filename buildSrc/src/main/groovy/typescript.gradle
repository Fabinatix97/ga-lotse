import de.eshg.frontend.IncludesAndExcludes
import de.eshg.frontend.TypescriptDefaults
import de.eshg.frontend.PnpmTaskWithProjectDependencies

def typescriptExtension = project.extensions.create('typescript', IncludesAndExcludes)
def distDir = layout.buildDirectory.dir('dist')

def getTypescriptInputFiles = {
  return fileTree(projectDir) {
    include typescriptExtension.include.get()
    exclude TypescriptDefaults.getAllExcludes(typescriptExtension.additionalExcludes)
  }
}

tasks.register('compile', PnpmTaskWithProjectDependencies) {
  group = 'package'

  inputs.files "${rootDir}/config/tsconfig.base.json"
  inputs.files "${projectDir}/tsconfig.json"
  inputs.files getTypescriptInputFiles()

  outputs.dir distDir

  outputs.cacheIf { true }

  args = ['tsc']

  doFirst {
    delete distDir
  }
}
