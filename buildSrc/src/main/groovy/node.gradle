plugins {
  id 'com.github.node-gradle.node'
}

node {
  version = '22.11.0'
  pnpmVersion = '9.13.2'
  download = true
  workDir = file("${rootProject.projectDir}/.gradle/nodejs")
  pnpmWorkDir = file("${rootProject.projectDir}/.gradle/pnpm")
}

ext {
  nodeDockerImage = "node:${node.version.get()}-alpine@sha256:c9bb43423a6229aeddf3d16ae6aaa0ff71a0b2951ce18ec8fedb6f5d766cf286"
}

tasks.register('cleanDependencies', Delete) {
  delete "${projectDir}/node_modules"
}

def isRootProject() {
  project.name == rootProject.name
}

// prevent duplicate node installation in subprojects
tasks.named('nodeSetup').configure {
  onlyIf('run only in root project') {
    isRootProject()
  }
}

// prevent duplicate pnpm installation in subprojects
tasks.named('pnpmSetup').configure {
  onlyIf('run only in root project') {
    isRootProject()
  }
}
