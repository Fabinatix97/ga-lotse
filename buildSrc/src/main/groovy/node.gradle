plugins {
  id 'com.github.node-gradle.node'
}

def gradleDir = rootProject.layout.projectDirectory.dir('.gradle')
def nodeSetupDir = gradleDir.dir('nodejs')
def pnpmSetupDir = gradleDir.dir('pnpm')

node {
  version = '22.17.0'
  pnpmVersion = '10.12.4'
  download = true
  workDir = nodeSetupDir
  pnpmWorkDir = pnpmSetupDir
}

ext {
  nodeDockerImage = "node:${node.version.get()}-alpine@sha256:5340cbfc2df14331ab021555fdd9f83f072ce811488e705b0e736b11adeec4bb"
}

def cleanDependenciesTask = tasks.register('cleanDependencies', Delete) {
  group = 'workspace'
  delete "${projectDir}/node_modules"
}

def cleanNodeSetupTask = tasks.register('cleanNodeSetup', Delete) {
  delete nodeSetupDir
  onlyIf('run only in root project') {
    isRootProject()
  }
}

def cleanPnpmSetupTask = tasks.register('cleanPnpmSetup', Delete) {
  delete pnpmSetupDir
  onlyIf('run only in root project') {
    isRootProject()
  }
}

tasks.register('clean', Delete) {
  dependsOn cleanDependenciesTask
  dependsOn cleanNodeSetupTask
  dependsOn cleanPnpmSetupTask
  delete project.layout.buildDirectory
}

def isRootProject() {
  project.name == rootProject.name
}

// prevent duplicate node installation in subprojects
tasks.named('nodeSetup').configure {
  onlyIf('run only in root project') {
    isRootProject()
  }
}

// prevent duplicate pnpm installation in subprojects
tasks.named('pnpmSetup').configure {
  onlyIf('run only in root project') {
    isRootProject()
  }
}
