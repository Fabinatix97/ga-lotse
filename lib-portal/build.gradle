plugins {
  id 'source-checks'
  id 'vitest'
}

prettier {
  include = ['**/*.ts', '**/*.tsx', '**/*.js', '**/*.json']
}

eslint {
  include = ['src/**/*.ts', 'src/**/*.tsx']
}

typescript {
  // ⚠⚠⚠ Note ⚠⚠⚠: Please adjust the tsconfig.json when changing includes/excludes here
  include = ['src/**/*.ts', 'src/**/*.tsx']
}

tasks.named('lint').configure {
  inputs.files "${rootDir}/config/eslint.next.js"
}

tasks.named('lintFix').configure {
  inputs.files "${rootDir}/config/eslint.next.js"
}

tasks.named('test').configure {
  inputs.file "${rootDir}/config/tsconfig.lib-legacy.json"
}

tasks.register('assemble') {
  dependsOn 'compile'
}

tasks.register('build') {
  dependsOn 'check'
  dependsOn 'assemble'
}
