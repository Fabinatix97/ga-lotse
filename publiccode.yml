    genericName: Anwendung für Gesundheitsämter
    longDescription: >
      GA-Lotse ist eine Anwendungsplattform für Gesundheitsämter in Deutschland.

      Sie wurde mit modernen Datenschutz- und Datensicherheitsmechanismen
      entwickelt.

      Die Anwendung ist im Kern ein Service-Mesh. Sie bietet zentrale Dienste,

      die die erforderliche Infrastruktur für jedes Geschäftsmodul
      bereitstellen.

      Daher können neue Geschäftsmodule einfach integriert werden.

      Das Ziel ist es, die vielfältige Anwendungslandschaft, die derzeit in den

      deutschen Gesundheitsämtern genutzt wird, zu vereinheitlichen, um
      Effizienz

      und Sicherheit zu verbessern und den Gesundheitsämtern zu ermöglichen,

      ihre Daten zu analysieren.
    shortDescription: GA-Lotse ist eine Anwendungsplattform für Gesundheitsämter in Deutschland.
