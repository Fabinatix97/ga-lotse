    genericName: Software for Health Departments
    longDescription: >
      GA-Lotse is an application platform for public health
      departments in Germany.

      It was developed with state-of-the-art privacy
      and data protection mechanisms in mind.

      The application is a service mesh at its core.

      It provides central services at its core, which provides the needed
      infrastructure for every business module.

      Therefore, new business modules can easily be integrated.

      The goal is to unify the vast application landscape that is currently
      used within the German health departments to improve efficiency and security
      and enable the health departments to analyse their data.
    shortDescription: GA-Lotse is an application platform for public health departments in Germany.
