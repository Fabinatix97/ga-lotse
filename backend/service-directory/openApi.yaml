openapi: 3.0.1
info:
  description: This is the api for Service Directory
  title: Service Directory Api
  version: "0.1"
servers:
- url: http://localhost:8083
paths:
  /adminapi/actors:
    post:
      operationId: createActor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPartialActor"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartialActor"
          description: Creates an actor
      summary: Create an actor
      tags:
      - ServiceDirectoryAdmin
    put:
      operationId: updateActor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPartialActor"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartialActor"
          description: Updates an actor
      summary: Update an actor
      tags:
      - ServiceDirectoryAdmin
  /adminapi/actors/activate/{id}:
    put:
      operationId: activateActorById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActor"
          description: Activates an actor
      summary: Activate an actor
      tags:
      - ServiceDirectoryAdmin
  /adminapi/actors/deactivate/{id}:
    put:
      operationId: deactivateActorById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActor"
          description: Deactivates an actor
      summary: Deactivate an actor
      tags:
      - ServiceDirectoryAdmin
  /adminapi/actors/metadata/{actorId}:
    get:
      operationId: getActorMetadataByActorId
      parameters:
      - in: path
        name: actorId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActorMetadata"
          description: Gets the meta data of an actor
      summary: Get the meta data of an actor by its actor id
      tags:
      - ServiceDirectoryAdmin
  /adminapi/actors/{actorId}/clients:
    get:
      operationId: getClientActorsForActor
      parameters:
      - in: path
        name: actorId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApplicableActorsResponse"
          description: Returns all audited actors that are a valid client for this
            actor
      summary: Get all audited actors that are a valid client for this actor
      tags:
      - ServiceDirectoryAdmin
  /adminapi/actors/{actorId}/servers:
    get:
      operationId: getServerActorsForActor
      parameters:
      - in: path
        name: actorId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApplicableActorsResponse"
          description: Returns all audited actors that are a valid server for this
            actor
      summary: Get all audited actors that are a valid server for this actor
      tags:
      - ServiceDirectoryAdmin
  /adminapi/actors/{id}:
    delete:
      operationId: deleteActorById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Deletes an actor by its id
      summary: Delete an actor by its id
      tags:
      - ServiceDirectoryAdmin
  /adminapi/export:
    get:
      operationId: getExport
      parameters:
      - in: query
        name: withCertificates
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
          description: Returns a JSON with all relevant (configuration) data of the
            service-directory
      summary: Export current service-directory data without staged data
      tags:
      - ServiceDirectoryAdmin
  /adminapi/import:
    post:
      operationId: postImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
        required: true
      responses:
        "200":
          description: Import from exported data into an empty database
      summary: Import from exported data into an empty database
      tags:
      - ServiceDirectoryAdmin
  /adminapi/orgUnits:
    get:
      operationId: getAllOrgUnits
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetOrgUnitsResponse"
          description: Returns all orgUnits
      summary: Get all orgUnits
      tags:
      - ServiceDirectoryAdmin
    post:
      operationId: createOrgUnit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPartialOrgUnit"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartialOrgUnit"
          description: Creates an orgUnit
      summary: Create an orgUnit
      tags:
      - ServiceDirectoryAdmin
    put:
      operationId: updateOrgUnit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPartialOrgUnit"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartialOrgUnit"
          description: Updates an orgUnit
      summary: Update an orgUnit
      tags:
      - ServiceDirectoryAdmin
  /adminapi/orgUnits/activate/{id}:
    put:
      operationId: activateOrgUnitById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrgUnit"
          description: Activates an orgUnit
      summary: Activate an orgUnit
      tags:
      - ServiceDirectoryAdmin
  /adminapi/orgUnits/deactivate/{id}:
    put:
      operationId: deactivateOrgUnitById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrgUnit"
          description: Deactivates an orgUnit
      summary: Deactivate an orgUnit
      tags:
      - ServiceDirectoryAdmin
  /adminapi/orgUnits/{id}:
    delete:
      operationId: deleteOrgUnitById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Deletes an orgUnit
      summary: Delete an orgUnit
      tags:
      - ServiceDirectoryAdmin
  /adminapi/revisions:
    get:
      operationId: getRevisions
      parameters:
      - in: query
        name: fromInclusive
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: toExclusive
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: username
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRevisionsResponse"
          description: OK
      summary: Get revisions
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules:
    get:
      operationId: getAllRules
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRulesResponse"
          description: Returns all rules
      summary: Get all rules
      tags:
      - ServiceDirectoryAdmin
    post:
      operationId: createRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPartialRule"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartialRule"
          description: Creates an rule
      summary: Create an rule
      tags:
      - ServiceDirectoryAdmin
    put:
      operationId: updateRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPartialRule"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartialRule"
          description: Updates an rule
      summary: Update an rule
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules/activate/{id}:
    put:
      operationId: activateRuleById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRule"
          description: Activates an rule
      summary: Activate an rule
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules/active:
    get:
      operationId: getAllActiveRules
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRulesResponse"
          description: Returns all active rules
      summary: Get all active rules
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules/active/{actorId}:
    get:
      operationId: getAllActiveAuditedRulesApplicableToActor
      parameters:
      - in: path
        name: actorId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetActiveApplicableRulesResponse"
          description: Returns all active audited rules applicable to the actor
      summary: Get all active audited rules applicable to actor
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules/deactivate/{id}:
    put:
      operationId: deactivateRuleById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRule"
          description: Deactivates an rule
      summary: Deactivate an rule
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules/{id}:
    delete:
      operationId: deleteRuleById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Deletes an rule
      summary: Delete an rule
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules/{ruleId}/clients:
    get:
      operationId: getActorsThatAreClientInRule
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApplicableActorsResponse"
          description: Returns all audited actors that are a client in this rule
      summary: Get all audited actors that are a client in this rule
      tags:
      - ServiceDirectoryAdmin
  /adminapi/rules/{ruleId}/servers:
    get:
      operationId: getActorsThatAreServerInRule
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApplicableActorsResponse"
          description: Returns all audited actors that are a server in this rule
      summary: Get all audited actors that are a server in this rule
      tags:
      - ServiceDirectoryAdmin
  /adminapi/staged:
    delete:
      operationId: deleteStaged
      parameters:
      - in: query
        name: user
        required: false
        schema:
          type: string
      - in: query
        name: ids
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        "200":
          description: Delete staged changes by user or by IDs
      summary: Reset staged changes by user
      tags:
      - ServiceDirectoryAdmin
    post:
      operationId: commitStaged
      parameters:
      - in: query
        name: user
        required: false
        schema:
          type: string
      - in: query
        name: ids
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - in: query
        name: dryRun
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCommitResponse"
          description: Commits staged changes by user
      summary: Commits staged changes by user
      tags:
      - ServiceDirectoryAdmin
  /adminapi/usernames:
    get:
      operationId: getUsernames
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetUsernamesResponse"
          description: OK
      summary: Get users that made changes
      tags:
      - ServiceDirectoryAdmin
  /api/actors/activeActors:
    get:
      operationId: getActiveActors
      parameters:
      - in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          $ref: "#/components/schemas/ActorType"
      - in: query
        name: orgUnitType
        required: false
        schema:
          $ref: "#/components/schemas/OrgUnitType"
      - in: query
        name: orgUnitId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetActiveActorsResponse"
          description: Returns an ResponseEntity object containing the list of active
            actors in the body and the ETag value in the response headers
      summary: "Get the active actors from the service directory. result can be filtered\
        \ by type, orgUnitType and orgUnitId, if needed"
      tags:
      - ServiceDirectory
  /api/actors/metadata/self:
    put:
      operationId: updateActorMetadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorMetadata"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActorResponse"
          description: "Updates the meta data of the actor making the request. If\
            \ it doesn't exists, create it."
      summary: "Update the meta data of the actor making this request. If it doesn't\
        \ exist, create it."
      tags:
      - ServiceDirectory
  /api/actors/self:
    get:
      operationId: getSelf
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActorResponse"
          description: Returns the actor making this request as an ActorResponseDto
            object
      summary: Get the actor making this request itself
      tags:
      - ServiceDirectory
  /api/actors/topology:
    post:
      operationId: postTopology
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostTopologyRequest"
        required: true
      responses:
        "200":
          description: Creates a topology by providing its actors
      summary: Create a topology by providing its actors
      tags:
      - ServiceDirectory
  /api/actors/trustedActors/self:
    get:
      operationId: getTrustedActors
      parameters:
      - in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetTrustedActorsResponse"
          description: Returns an ResponseEntity object containing the sets of active
            actors allowed as clients and servers of the caller in the body and the
            ETag value in the response headers
      summary: "Get the active actors from the service directory, the caller can trust"
      tags:
      - ServiceDirectory
  /api/actors/{commonName}:
    get:
      operationId: getNaturalIdByCommonName
      parameters:
      - in: path
        name: commonName
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: Gets the natural id of an actor by its common name
      summary: Get the natural id of an actor by its common name
      tags:
      - ServiceDirectory
  /test-helper/commit-staged:
    post:
      operationId: testHelperCommitStaged
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCommitResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/export:
    get:
      operationId: testHelperExport
      parameters:
      - in: query
        name: withCertificates
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExportResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/import:
    post:
      operationId: testHelperImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/population:
    post:
      operationId: populateDefaults
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefaultPopulationResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/population/org-units:
    post:
      operationId: populateOrgUnits
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitPopulationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrgUnitPopulationResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor:
    post:
      operationId: interceptNextRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertRequestInterceptionTestHelperRequest"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/barriers:
    post:
      operationId: addBarrier
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperInterceptionRequestFilter"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddBarrierTestHelperResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/barriers/{barrierId}/await:
    post:
      operationId: awaitBarrier
      parameters:
      - in: path
        name: barrierId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: timeoutInMillis
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/reset:
    post:
      operationId: resetInterceptionsAndBarriers
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/reset:
    post:
      operationId: reset
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/set-clock:
    patch:
      operationId: setClock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperClockSetRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/wind-clock:
    patch:
      operationId: windClockForward
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperClockWindForwardRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
components:
  schemas:
    ActorMetadata:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
        content:
          type: string
        id:
          type: string
          format: uuid
    ActorRequest:
      type: object
      properties:
        certificate:
          $ref: "#/components/schemas/Certificate"
        hostName:
          type: string
        readableName:
          type: string
        type:
          $ref: "#/components/schemas/ActorType"
    ActorResponse:
      type: object
      properties:
        active:
          type: boolean
        actorMetadata:
          $ref: "#/components/schemas/ActorMetadata"
        commonName:
          type: string
        currentCertificate:
          $ref: "#/components/schemas/Certificate"
        id:
          type: string
          format: uuid
        naturalId:
          type: string
        networkId:
          type: string
        orgUnitId:
          type: string
          format: uuid
        previousCertificate:
          $ref: "#/components/schemas/Certificate"
        readableName:
          type: string
        type:
          $ref: "#/components/schemas/ActorType"
      required:
      - active
    ActorType:
      type: string
      enum:
      - GM
      - FM
      - LSD
      - WEB
      - ZA
      - ZR
    AddBarrierTestHelperResponse:
      type: object
      properties:
        barrierId:
          type: integer
          format: int64
          minimum: 1
      required:
      - barrierId
    AdminActor:
      type: object
      properties:
        active:
          type: boolean
        commonName:
          type: string
        currentCertificate:
          $ref: "#/components/schemas/AdminCertificate"
        id:
          type: string
          format: uuid
        metadata:
          $ref: "#/components/schemas/AdminActorMetadata"
        naturalId:
          type: string
        networkId:
          type: string
        previousCertificate:
          $ref: "#/components/schemas/AdminCertificate"
        readableName:
          type: string
        type:
          $ref: "#/components/schemas/AdminActorType"
      required:
      - active
      - commonName
      - id
      - readableName
      - type
    AdminActorMetadata:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
        content:
          type: string
        id:
          type: string
          format: uuid
      required:
      - changedAt
      - id
    AdminActorSelector:
      type: object
      properties:
        actorName:
          type: string
        actorType:
          type: string
        federalState:
          type: string
        orgUnitName:
          type: string
        orgUnitType:
          type: string
    AdminActorType:
      type: string
      enum:
      - GM
      - FM
      - LSD
      - WEB
      - ZA
      - ZR
    AdminCertificate:
      type: object
      properties:
        signatory:
          type: string
        signature:
          type: string
        value:
          type: string
      required:
      - signatory
      - signature
      - value
    AdminCommitResponse:
      type: object
      properties:
        actors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AdminActor"
        deletedActors:
          type: array
          items:
            type: string
            format: uuid
        deletedOrgUnits:
          type: array
          items:
            type: string
            format: uuid
        deletedRules:
          type: array
          items:
            type: string
            format: uuid
        orgUnits:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AdminOrgUnit"
        rules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AdminRule"
    AdminOrgUnit:
      type: object
      properties:
        active:
          type: boolean
        actors:
          type: array
          items:
            $ref: "#/components/schemas/AdminActor"
        federalState:
          $ref: "#/components/schemas/FederalState"
        id:
          type: string
          format: uuid
        readableName:
          type: string
        type:
          $ref: "#/components/schemas/AdminOrgUnitType"
      required:
      - active
      - actors
      - federalState
      - id
      - readableName
      - type
    AdminOrgUnitType:
      type: string
      enum:
      - GA
      - LA
      - ZD
