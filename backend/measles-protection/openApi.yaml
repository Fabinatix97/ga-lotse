          example: "['mail1@address.de','mail2@address.de','mail3@address.de']"
          items:
            type: string
        firstName:
          type: string
          description: The given name(s) of the Person.
          example: John
          maxLength: 80
          minLength: 1
        gender:
          $ref: "#/components/schemas/Gender"
