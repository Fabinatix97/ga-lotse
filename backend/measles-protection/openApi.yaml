          description: OK
      summary: Get list of procedure's progress entries
      tags:
      - ProgressEntry
    post:
      description: |-
        Creates a manual progress entry with an optional file upload.

               Permitted file formats:
                - Image formats: jpeg, png
                - PDF formats: pdf/a
                - Mail formats: eml
      operationId: addProgressEntry
      parameters:
