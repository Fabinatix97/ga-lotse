  /protection-procedures:
    get:
      operationId: getProcedures
      parameters:
      - description: The page to be returned
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: The number of items to be returned
        in: query
        name: pageSize
        required: false
