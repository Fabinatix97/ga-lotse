        nameAtBirth:
          type: string
        phoneNumbers:
          type: array
          items:
            type: string
        placeOfBirth:
          type: string
        roleStatus:
          $ref: "#/components/schemas/RoleStatus"
        salutation:
          $ref: "#/components/schemas/Salutation"
        title:
          type: string
      required:
      - address
      - dateOfBirth
      - firstName
      - lastName
    AffectedPersonDetails:
