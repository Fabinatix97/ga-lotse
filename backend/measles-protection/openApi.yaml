          $ref: "#/components/schemas/Salutation"
        title:
          type: string
          description: The academic title of a Person.
          example: Prof. Dr.
          maxLength: 119
          minLength: 1
      required:
      - dataOrigin
      - dateOfBirth
      - emailAddresses
      - firstName
      - gender
      - id
