components:
  schemas:
    AbstractFile:
      type: object
      allOf:
      - $ref: "#/components/schemas/AbstractFileReference"
      - type: object
        properties:
          attachedToMail:
            type: string
            format: uuid
          createdAt:
            type: string
            format: date-time
          createdBy:
            type: string
            format: uuid
          fileName:
            type: string
          fileSizeBytes:
            type: integer
            format: int32
          fileType:
            $ref: "#/components/schemas/FileType"
          locked:
            type: boolean
          modifiedAt:
            type: string
            format: date-time
      - type: object
        properties:
          '@type':
            type: string
      discriminator:
        propertyName: '@type'
      required:
      - '@type'
      - createdAt
      - createdBy
      - deletable
      - deleted
      - fileId
      - fileName
      - fileSizeBytes
      - fileType
      - locked
      - modifiedAt
    AbstractFileReference:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
        deletable:
          type: boolean
        deleted:
          type: boolean
        fileId:
          type: string
          format: uuid
      required:
      - '@type'
      - deletable
      - deleted
      - fileId
    AccessRestriction:
      type: object
      properties:
        letters:
          type: array
          items:
            $ref: "#/components/schemas/AccessRestrictionLetter"
        restrictionIssuedDate:
          type: string
          format: date
          description: The date when the access restriction was issued.
          example: 2024-02-03
        restrictionStartDate:
          type: string
          format: date
          description: The date when the access restriction becomes effective.
          example: 2024-02-10
        restrictionTerminationDate:
          type: string
          format: date
          description: The date when the access restriction is terminated.
          example: 2024-02-28
      required:
      - restrictionIssuedDate
      - restrictionStartDate
    AccessRestrictionLetter:
      type: object
      properties:
        documentFileId:
          type: string
          format: uuid
          description: The id of the document related to the access restriction letter.
        externalId:
          type: string
          format: uuid
          description: The unique identifier for the access restriction letter.
          example: 0e47cc46-0092-40df-883b-581e31288e28
        recipientId:
          type: string
          format: uuid
          description: The unique identifier for the recipient of the restriction
            letter.
        sentAt:
          type: string
          format: date
          description: The date and time when the access restriction letter was sent.
          example: 2024-06-03
      required:
      - externalId
      - recipientId
      - sentAt
    AddBarrierTestHelperResponse:
      type: object
      properties:
        barrierId:
          type: integer
          format: int64
          minimum: 1
      required:
      - barrierId
    AddCustodianRequest:
      type: object
      properties:
        custodian:
          $ref: "#/components/schemas/CustodianDetails"
      required:
      - custodian
    AddCustodianResponse:
      type: object
      properties:
        custodian:
          $ref: "#/components/schemas/CustodianDetails"
        id:
          type: string
          format: uuid
      required:
      - custodian
      - id
    AddFacilityFileStateRequest:
      type: object
      description: Request used for adding facilities from non-external sources
      properties:
        contactAddress:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        contactPersons:
          type: array
          description: A list of contact persons of the Facility.
          items:
            $ref: "#/components/schemas/FacilityContactPerson"
        dataOrigin:
          $ref: "#/components/schemas/DataOrigin"
        differentBillingAddress:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        emailAddresses:
          type: array
          description: A list of email addresses of the Facility.
          example: "['mail1@address.de','mail2@address.de','mail3@address.de']"
          items:
            type: string
        name:
          type: string
          description: The name of the Facility.
          example: Example Facility
          maxLength: 300
          minLength: 1
        partialMatch:
          type: boolean
          description: "If only the knowledge factor `name` as well as the address\
            \ (apart from `addressAddition` and `differentName`) shall be used for\
            \ establishing a connection to an existing referenceFacility instead of\
            \ a full match of the complete entity. This is useful for automatic connections,\
            \ e.g. for imports, where incomplete data is present."
          example: true
        phoneNumbers:
          type: array
          description: A list of telephone numbers of the Facility.
          example: "['+4912345678901','+4912345678902','+4912345678903']"
          items:
            type: string
        referenceFacilityId:
          type: string
          format: uuid
          description: "Id of a referenceFacility. If this Id is provided, a new File\
            \ State with the input attributes is created for that referenceFacility,\
            \ regardless of any matching logic."
          example: be9831d4-dc25-48d8-9bfe-4c0b54bfb2c1
      required:
      - dataOrigin
      - name
    AddFacilityRequest:
      type: object
      properties:
        facility:
          $ref: "#/components/schemas/AddFacilityFileStateRequest"
        otherFacilityTypeInformation:
          type: string
        type:
          $ref: "#/components/schemas/MPFacilityType"
      required:
      - facility
      - type
    AddFacilityResponse:
      type: object
      properties:
        facility:
          $ref: "#/components/schemas/Facility"
        id:
          type: string
          format: uuid
      required:
      - facility
      - id
    AddPersonFileStateRequest:
      type: object
      description: Request used for adding persons from non-external sources
      properties:
        contactAddress:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        countryOfBirth:
          $ref: "#/components/schemas/CountryCode"
        dataOrigin:
          $ref: "#/components/schemas/DataOrigin"
        dateOfBirth:
          type: string
          format: date
          description: The date of birth of the Person.
          example: 2000-01-01
        differentBillingAddress:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        emailAddresses:
          type: array
          description: A list of email addresses of the Person.
          example: "['mail1@address.de','mail2@address.de','mail3@address.de']"
          items:
            type: string
        firstName:
          type: string
          description: The given name(s) of the Person.
          example: John
          maxLength: 80
          minLength: 1
        gender:
          $ref: "#/components/schemas/Gender"
        lastName:
          type: string
          description: The last name of the Person.
          example: Doe
          maxLength: 120
          minLength: 1
        nameAtBirth:
          type: string
          description: The last name at birth of the Person.
          example: Smith
          maxLength: 40
          minLength: 1
        phoneNumbers:
          type: array
          description: A list of telephone numbers of the Person.
          example: "['+4912345678901','+4912345678902','+4912345678903']"
          items:
            type: string
        placeOfBirth:
          type: string
          description: The place of birth (without country) of the Person.
          example: Berlin
          maxLength: 50
          minLength: 1
        referencePersonId:
          type: string
          format: uuid
          description: "Id of a referencePerson. If this Id is provided, a new File\
            \ State with the input attributes is created for that referencePerson,\
            \ regardless of any matching logic."
          example: be9831d4-dc25-48d8-9bfe-4c0b54bfb2c1
        salutation:
          $ref: "#/components/schemas/Salutation"
        title:
          type: string
          description: The academic title of a Person.
          example: Prof. Dr.
          maxLength: 119
          minLength: 1
      required:
      - dataOrigin
      - dateOfBirth
      - firstName
      - lastName
    Address:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
      required:
      - '@type'
    AffectedPerson:
      type: object
      description: Represents the individual the facility reports on and is the integral
        part of the procedure.
      properties:
        address:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        countryOfBirth:
          $ref: "#/components/schemas/CountryCode"
        dateOfBirth:
          type: string
          format: date
          description: Date of birth of the affected person.
          example: 2018-07-26
        emailAddresses:
          type: array
          items:
            type: string
        firstName:
          type: string
          description: First name of the affected person.
          example: Susanne
        gender:
          $ref: "#/components/schemas/Gender"
        id:
          type: string
          format: uuid
        lastName:
          type: string
          description: Last name of the affected person.
