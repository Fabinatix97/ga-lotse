      - PERSON_NOT_ACTIVE
      - PERSON_TEMP_NOT_ACTIVE
      - MEDICAL_ATTEST
      - TEMP_MEDICAL_ATTEST
      - AUTHORITY_HANDOVER
      - ACCESS_RESTRICTED
      - INDIVIDUAL_REVIEW
