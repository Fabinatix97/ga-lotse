openapi: 3.0.1
info:
  description: This is the API for the school-entry module
  title: School Entry Module API
  version: "0.1"
servers:
- url: http://localhost:8082
paths:
  /appointment-blocks/appointment-block-groups:
    get:
      operationId: getAppointmentBlockGroups
      parameters:
      - in: query
        name: sortKey
        required: false
        schema:
          $ref: "#/components/schemas/AppointmentBlockSortKey"
      - in: query
        name: sortDirection
        required: false
        schema:
          $ref: "#/components/schemas/SortDirection"
      - in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetAppointmentBlockGroupsResponse"
          description: OK
      summary: Get all appointment block groups.
      tags:
      - AppointmentBlock
    post:
      operationId: createAppointmentBlockGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBlockGroupRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateAppointmentBlockGroupResponse"
          description: OK
      summary: Create an appointment block group.
      tags:
      - AppointmentBlock
  /appointment-blocks/appointment-block-groups/validate:
    post:
      operationId: validateAppointmentBlockGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBlockGroupRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidateAppointmentBlockGroupResponse"
          description: OK
      summary: Create an appointment block group.
      tags:
      - AppointmentBlock
  /appointment-blocks/daily-appointment-block-groups:
    post:
      operationId: createDailyAppointmentBlocksForGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDailyAppointmentBlockGroupRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateAppointmentBlockGroupResponse"
          description: OK
      summary: Create appointment group with blocks for week days.
      tags:
      - AppointmentBlock
  /appointment-blocks/daily-appointment-block-groups/validate:
    post:
      operationId: validateDailyAppointmentBlocksForGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDailyAppointmentBlockGroupRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidateAppointmentBlockGroupResponse"
          description: OK
      summary: Create appointment group with blocks for week days.
      tags:
      - AppointmentBlock
  /appointment-blocks/free-appointments:
    get:
      operationId: getFreeAppointments
      parameters:
      - in: query
        name: appointmentType
        required: true
        schema:
          $ref: "#/components/schemas/AppointmentType"
      - in: query
        name: earliestDate
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetFreeAppointmentsResponse"
          description: OK
      summary: Get free appointments for an appointment type.
      tags:
      - AppointmentBlock
  /appointment-types:
    get:
      operationId: getAppointmentTypes
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetAppointmentTypesResponse"
          description: OK
      summary: Gets all Appointment Types
      tags:
      - AppointmentType
  /appointment-types/{id}:
    get:
      operationId: getOneAppointmentType
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentTypeConfig"
          description: OK
      summary: Gets one Appointment Type by ID
      tags:
      - AppointmentType
    put:
      operationId: updateAppointmentType
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentTypeRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentTypeConfig"
          description: OK
      summary: Modifies an existing Appointment Type
      tags:
      - AppointmentType
  /approval-requests/{approvalRequestId}:
    get:
      operationId: getApprovalRequest
      parameters:
      - in: path
        name: approvalRequestId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: OK
      tags:
      - ApprovalRequest
  /approval-requests/{approvalRequestId}/decision:
    put:
      operationId: decideApprovalRequest
      parameters:
      - in: path
        name: approvalRequestId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - ApprovalRequest
  /archiving/config:
    get:
      operationId: getArchivingConfiguration
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetArchivingConfigurationResponse"
          description: OK
      summary: Get archiving configuration
      tags:
      - Archiving
  /archiving/procedures:
    get:
      operationId: getArchivableProcedures
      parameters:
      - description: |
          Filter logic:
          - If `procedureType` is submitted, only procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place
        in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `closedAtDay` is set, only procedures are returned which were closed at that date
          - If not submitted, no filtering takes place
        in: query
        name: closedAtDay
        required: false
        schema:
          type: string
          format: date
      - description: |
          Filter logic:
          - If `defaultArchivingRelevance` is submitted, only procedures are returned which have one of the submitted default archiving relevances.
          - If not submitted, no filtering takes place
        in: query
        name: defaultArchivingRelevance
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ArchivingRelevance"
          uniqueItems: true
      - description: |
          The following sorting options are available:
          - `CLOSED_AT`: Sorting by closedAt attribute
          - `PROCEDURE_TYPE`: Sorting by procedureType attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetArchivableProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetArchivableProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetArchivableProceduresResponse"
          description: OK
      summary: Get archivable procedures
      tags:
      - Archiving
  /archiving/procedures/bulk-update-archiving-relevance:
    post:
      operationId: bulkUpdateProceduresArchivingRelevance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateProceduresArchivingRelevanceRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkUpdateProceduresArchivingRelevanceResponse"
          description: OK
      summary: Bulk update procedures archiving relevance
      tags:
      - Archiving
  /archiving/relevant-procedures:
    get:
      operationId: getRelevantArchivableProcedures
      parameters:
      - description: |
          Filter logic:
          - If `closedAtDay` is set, only procedures are returned which were closed at that date
          - If not submitted, no filtering takes place
        in: query
        name: closedAtDay
        required: false
        schema:
          type: string
          format: date
      - description: |
          Filter logic:
          - If `exported` is true, only procedures are returned which have already been exported.
          - If `exported` is false, only procedures are returned which have not been exported, yet.
          - If not submitted, no filtering takes place
        in: query
        name: exported
        required: false
        schema:
          type: boolean
      - description: |
          The following sorting options are available:
          - `CLOSED_AT`: Sorting by closedAt attribute
          - `EXPORTED_AT`: Sorting by exportedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetRelevantArchivableProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetRelevantArchivableProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRelevantArchivableProceduresResponse"
          description: OK
      summary: Get relevant archivable procedures
      tags:
      - Archiving
  /archiving/relevant-procedures/export:
    post:
      operationId: exportRelevantProcedures
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportArchivingRelevantProceduresRequest"
        required: true
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: OK
      tags:
      - Archiving
  /citizen/school-entries:
    get:
      operationId: getSelfProcedureAsCitizen
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetCitizenProcedureResponse"
          description: OK
      tags:
      - SchoolEntryCitizen
  /citizen/school-entries/anamnesis:
    put:
      operationId: addAnamnesisAsCitizen
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCitizenAnamnesisRequest"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - SchoolEntryCitizen
  /citizen/school-entries/appointment:
    put:
      operationId: updateAppointmentAsCitizen
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCitizenAppointmentRequest"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - SchoolEntryCitizen
  /citizen/school-entries/documents/privacy-notice:
    get:
      operationId: getPrivacyNotice
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
      summary: Get the privacy-notice document.
      tags:
      - SchoolEntryCitizen
  /citizen/school-entries/documents/privacy-policy:
    get:
      operationId: getPrivacyPolicy
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
      summary: Get the privacy-policy document.
      tags:
      - SchoolEntryCitizen
  /citizen/school-entries/free-appointments:
    get:
      operationId: getSelfFreeAppointmentsAsCitizen
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetCitizenFreeAppointmentsResponse"
          description: OK
      tags:
      - SchoolEntryCitizen
  /config:
    get:
      operationId: getConfig
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetSchoolEntryConfigResponse"
          description: OK
      tags:
      - SchoolEntryConfig
  /country-codes:
    get:
      operationId: getCountryCodes
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetCountryCodesResponse"
          description: OK
      tags:
      - SchoolEntryCountryCodes
  /feature-toggles:
    get:
      operationId: getFeatureToggles
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetSchoolEntryFeatureTogglesResponse"
          description: OK
      tags:
      - SchoolEntryFeatureToggles
  /files/{fileId}:
    delete:
      operationId: deleteFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Soft deletes the specified file
      tags:
      - File
    get:
      operationId: getFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/Image"
                - $ref: "#/components/schemas/Mail"
                - $ref: "#/components/schemas/Pdf"
          description: OK
      summary: Retrieves the meta data of the specified file
      tags:
      - File
  /files/{fileId}/deletion-request:
    post:
      operationId: requestFileDeletion
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequestRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: OK
      summary: Request deletion of a file entry
      tags:
      - File
  /files/{fileId}/download:
    get:
      operationId: downloadFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: OK
      tags:
      - File
  /files/{fileId}/meta-data:
    put:
      operationId: updateFileMetaData
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/ImageMetaData"
              - $ref: "#/components/schemas/MailMetaData"
              - $ref: "#/components/schemas/PdfMetaData"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/Image"
                - $ref: "#/components/schemas/Mail"
                - $ref: "#/components/schemas/Pdf"
          description: Updated file
      summary: Updates the meta data of the specified file
      tags:
      - File
  /files/{fileId}/meta-data/history:
    get:
      operationId: getMetaDataHistory
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetMetaDataHistoryResponse"
          description: OK
      tags:
      - File
  /inbox-procedures:
    get:
      description: |
        Get all inbox procedures with filter, sort, and pagination options
      operationId: getInboxProcedures
      parameters:
      - description: |
          Filter logic:
          - If `inboxProcedureType` is submitted, only inbox procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place.
        in: query
        name: inboxProcedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If true, inbox procedures which have no type are returned in addition to the types specified by 'inboxProcedureType'.
          - If false or not submitted, inbox procedures which have no type are not returned.
        in: query
        name: includeUntyped
        required: false
        schema:
          type: boolean
      - description: |
          Filter logic:
          - If `inboxProcedureStatus` is submitted, only inbox procedures are returned which have one of the submitted statuses.
          - If not submitted, no filtering takes place.
        in: query
        name: inboxProcedureStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/InboxProcedureStatus"
          uniqueItems: true
      - description: |
          The following sorting options are available:
          - `CREATED_AT`: Sorting by createdAt attribute
          - `MODIFIED_AT`: Sorting by modifiedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetInboxProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetInboxProceduresSortOrder"
      - description: Number of the requested page
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: Amount of requested inbox procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetInboxProceduresResponse"
          description: OK
      summary: Get inbox procedures
      tags:
      - InboxProcedure
    post:
      description: |-
        Creates an inbox procedure with an optional file upload.

               Permitted file formats:
                - Image formats: jpeg, png
                - PDF formats: pdf/a
                - Mail formats: eml
      operationId: addInboxProcedure
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                createInboxProcedureRequest:
                  $ref: "#/components/schemas/CreateInboxProcedureRequest"
                file:
                  type: string
                  format: binary
                fileMetaData:
                  $ref: "#/components/schemas/FileMetaData"
              required:
              - createInboxProcedureRequest
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InboxProcedure"
          description: OK
      summary: Add inbox procedure
      tags:
      - InboxProcedure
  /inbox-procedures/{inboxProcedureId}:
    get:
      operationId: getInboxProcedure
      parameters:
      - in: path
        name: inboxProcedureId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetInboxProcedureResponse"
          description: OK
      summary: Get inbox procedure with detailed information
      tags:
      - InboxProcedure
  /inbox-procedures/{inboxProcedureId}/inbox-procedure-status:
    put:
      operationId: updateInboxProcedureStatus
      parameters:
      - in: path
        name: inboxProcedureId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxProcedureStatus"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InboxProcedure"
          description: OK
      summary: Update status of inbox procedure
      tags:
      - InboxProcedure
  /procedure-metrics:
    get:
      operationId: getProcedureMetrics
      parameters:
      - in: query
        name: timeRangeStart
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: timeRangeEnd
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProcedureMetricsResponse"
          description: the metrics of procedures
      summary: Get procedure metrics for procedures created in the given time range
      tags:
      - Procedure
  /procedures:
    get:
      description: |
        GET operation for retrieving basic information of procedures for the procedure overview.
      operationId: getProcedures_1
      parameters:
      - description: |
          Only procedures are returned where the assigneeId of at least one task equals the `assignedToId`.
          If not submitted, no filtering takes place.
        in: query
        name: assignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Only procedures are returned where the assigneeId of none of the task equals `notAssignedToId`.
          If not submitted, no filtering takes place.
        in: query
        name: notAssignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Only procedures are returned where the user is or was assigned to at least one task (at least one assigneeId equals `onceAssignedToId` in taskHistory for at least one task).
          If not submitted, no filtering takes place.
        in: query
        name: onceAssignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Filter logic:
          - In case of `true` only procedures are returned where all tasks are unassigned
          - In case of `false` only procedures are returned which have at least one assigned task
          - If not submitted, no filtering takes place
        in: query
        name: unassigned
        required: false
        schema:
          type: boolean
      - description: |
          Filter logic:
          - If `procedureType` is submitted, only procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place
        in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `procedureStatus` is submitted, only procedures are returned which have one of the submitted statuses.
          - If not submitted, no filtering takes place
        in: query
        name: procedureStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureStatus"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `createdInYear` is set, only procedures are returned which were created in that year
          - If not submitted, no filtering takes place
        in: query
        name: createdInYear
        required: false
        schema:
          type: string
      - description: |
          The following sorting options are available:
          - `CREATED_AT`: Sorting by createdAt attribute
          - `MODIFIED_AT`: Sorting by modifiedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProceduresResponse"
          description: the users recent procedures
      summary: Get recent procedures for user
      tags:
      - Procedure
  /procedures/recent:
    get:
      operationId: getRecentProcedures
      parameters:
      - in: query
