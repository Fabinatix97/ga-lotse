components:
  schemas:
    AbstractFile:
      type: object
      allOf:
      - $ref: "#/components/schemas/AbstractFileReference"
      - type: object
        properties:
          attachedToMail:
            type: string
            format: uuid
          createdAt:
            type: string
            format: date-time
          createdBy:
            type: string
            format: uuid
          fileName:
            type: string
          fileSizeBytes:
            type: integer
            format: int32
          fileType:
            $ref: "#/components/schemas/FileType"
          locked:
            type: boolean
          modifiedAt:
            type: string
            format: date-time
      - type: object
        properties:
          '@type':
            type: string
      discriminator:
        propertyName: '@type'
      required:
      - '@type'
      - createdAt
      - createdBy
      - deletable
      - deleted
      - fileId
      - fileName
      - fileSizeBytes
      - fileType
      - locked
      - modifiedAt
    AbstractFileReference:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
        deletable:
          type: boolean
        deleted:
          type: boolean
        fileId:
          type: string
          format: uuid
      required:
      - '@type'
      - deletable
      - deleted
      - fileId
    AddBarrierTestHelperResponse:
      type: object
      properties:
        barrierId:
          type: integer
          format: int64
          minimum: 1
      required:
      - barrierId
    AddCitizenAnamnesisRequest:
      type: object
      description: Add an anamnesis of the child completed by the custodians.
      properties:
        anamnesis:
          $ref: "#/components/schemas/CitizenAnamnesis"
      required:
      - anamnesis
    AddCustodianRequest:
      type: object
      properties:
        custodian:
          $ref: "#/components/schemas/CreatePerson"
        procedureVersion:
          type: integer
          format: int64
      required:
      - custodian
      - procedureVersion
    AdditionalChildInfo:
      type: object
      properties:
        numberOfSiblings:
          type: integer
          format: int32
        responsiblePhysician:
          type: string
        siblingsBirthYears:
          type: array
          items:
            type: integer
            format: int32
    Address:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
      required:
      - '@type'
    Anamnesis:
      type: object
      properties:
        additionalChildInfo:
          $ref: "#/components/schemas/AdditionalChildInfo"
        checkUps:
          $ref: "#/components/schemas/CheckUps"
        childLanguageScreening:
          type: boolean
          description: "Boolean that indicates, if the child participated in the KiSS\
            \ language screening."
        daycareAndSchoolInfo:
          $ref: "#/components/schemas/DaycareAndSchoolInfo"
        developmentInfo:
          $ref: "#/components/schemas/DevelopmentInfo"
        familyHistoryInfo:
          $ref: "#/components/schemas/FamilyHistoryInfo"
        illnessAndAccidentInfo:
          $ref: "#/components/schemas/IllnessAndAccidentInfo"
        interestsAndSportsInfo:
          $ref: "#/components/schemas/InterestsAndSportsInfo"
        migrationBackground:
          $ref: "#/components/schemas/MigrationBackground"
        personalConspicuities:
          type: boolean
        preliminaryCourse:
          type: boolean
          description: "Boolean that indicates, if the child participated in a preliminary\
            \ course."
        promotionBeforeSchoolEntry:
          $ref: "#/components/schemas/PromotionBeforeSchoolEntry"
        promotionTherapyAndAidInfo:
          $ref: "#/components/schemas/PromotionTherapyAndAidInfo"
        version:
          type: integer
          format: int64
          description: "Version of the entity. Each time the entity is changed, it\
            \ is incremented by one."
      required:
      - additionalChildInfo
      - checkUps
      - daycareAndSchoolInfo
      - developmentInfo
      - familyHistoryInfo
      - illnessAndAccidentInfo
      - interestsAndSportsInfo
      - migrationBackground
      - promotionBeforeSchoolEntry
      - promotionTherapyAndAidInfo
      - version
    Appointment:
      type: object
      description: Appointment of a procedure.
      properties:
        end:
          type: string
          format: date-time
        start:
          type: string
          format: date-time
      required:
      - end
      - start
    AppointmentBlockSortKey:
      type: string
      enum:
      - START
      - END
    AppointmentLocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    AppointmentType:
      type: string
      enum:
      - CONSULTATION
      - VACCINATION
      - REGULAR_EXAMINATION
      - CAN_CHILD
      - ENTRY_LEVEL
      - SPECIAL_NEEDS
      - PROOF_SUBMISSION
      - HIV_STI_CONSULTATION
      - SEX_WORK
      - RESULTS_REVIEW
    AppointmentTypeConfig:
      type: object
      properties:
        appointmentTypeDto:
          $ref: "#/components/schemas/AppointmentType"
        id:
          type: string
          format: uuid
        standardDurationInMinutes:
          type: integer
          format: int32
          minimum: 0
      required:
      - appointmentTypeDto
      - id
      - standardDurationInMinutes
    ApprovalRequest:
      type: object
      properties:
        approvalRequestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          format: uuid
        decision:
          $ref: "#/components/schemas/Decision"
        entity:
          oneOf:
          - $ref: "#/components/schemas/ManualProgressEntry"
          - $ref: "#/components/schemas/Image"
          - $ref: "#/components/schemas/Mail"
          - $ref: "#/components/schemas/Pdf"
        operation:
          $ref: "#/components/schemas/Operation"
        reason:
          type: string
        status:
          $ref: "#/components/schemas/ApprovalRequestStatus"
      required:
      - approvalRequestId
      - createdAt
      - createdBy
      - operation
      - reason
      - status
    ApprovalRequestEntity:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
      required:
      - '@type'
    ApprovalRequestStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
    ArchivingDetails:
      type: object
      properties:
        archivingPeriodYears:
          type: integer
          format: int32
        archivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
      required:
      - archivingPeriodYears
      - archivingRelevance
    ArchivingRelevance:
      type: string
      enum:
      - DEFAULT
      - RELEVANT
      - IRRELEVANT
    ArchivingRelevanceSettings:
      type: object
      properties:
        archivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
        defaultArchivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
      required:
      - archivingRelevance
      - defaultArchivingRelevance
    Articulation:
      type: object
      properties:
        formationChPoints:
          $ref: "#/components/schemas/ArticulationValue"
        formationSchPoints:
          $ref: "#/components/schemas/ArticulationValue"
        formationsTrDrKrGrPoints:
          $ref: "#/components/schemas/ArticulationValue"
        letterBPoints:
          $ref: "#/components/schemas/ArticulationValue"
        letterFAndFormationPfPoints:
