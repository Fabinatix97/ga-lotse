spring.datasource.url=jdbc:postgresql://localhost:5445/sti_protection
spring.datasource.username=testuser
spring.datasource.password=testpassword
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/migrations/changelog.xml

# The port should match the one specified in the configuration annotated with @OpenAPIDefinition.
server.port=8095

logging.level.org.zalando.logbook=TRACE

spring.security.oauth2.client.registration.module-client.client-id=system-sti-protection
spring.security.oauth2.client.registration.module-client.client-secret=password
spring.security.oauth2.client.provider.eshg-keycloak.token-uri=${eshg.keycloak.internal.url}/realms/eshg/protocol/openid-connect/token

de.eshg.lib.appointmentblock.defaultAppointmentTypeConfiguration[HIV_STI_CONSULTATION]=30m
de.eshg.lib.appointmentblock.defaultAppointmentTypeConfiguration[SEX_WORK]=30m
de.eshg.lib.appointmentblock.defaultAppointmentTypeConfiguration[RESULTS_REVIEW]=30m

eshg.population.default-number-of-entities-to-populate.sti-protection-procedure=30
eshg.population.default-number-of-entities-to-populate.text-template-dto=30
eshg.population.default-number-of-entities-to-populate.appointment-block-group=0

eshg.sti-protection.overdue-procedures.cron=0 0 1 * * *
eshg.sti-protection.overdue-procedures.overdue-duration=180d

eshg.sti-protection.passed-appointment.cron=0 */1 * * * *

eshg.sti-protection.unconfirmed-appointments.cron=@hourly
# https://docs.spring.io/spring-boot/reference/features/external-config.html#features.external-config.typesafe-configuration-properties.conversion.durations
eshg.sti-protection.unconfirmed-appointments.expire-after=1h

eshg.sti-protection.appointment-cooldown.cron=0 */1 * * * *
eshg.sti-protection.appointment-cooldown.release-after=5m

de.eshg.sti-protection.medical-history.consultation-de-location=classpath:templates/documents/medical_history_consultation_printable_de.pdf
de.eshg.sti-protection.medical-history.consultation-en-location=classpath:templates/documents/medical_history_consultation_printable_en.pdf
de.eshg.sti-protection.medical-history.sexwork-de-location=classpath:templates/documents/medical_history_sexwork_printable_de.pdf
de.eshg.sti-protection.medical-history.sexwork-en-location=classpath:templates/documents/medical_history_sexwork_printable_en.pdf

de.eshg.sti-protection.department-info.hiv_sti_consultation.use-department-info-from-base-module=true
de.eshg.sti-protection.department-info.sex_work.use-department-info-from-base-module=true

de.eshg.sti-protection.opening-hours.sex_work.de[0]=Nur nach Terminabsprache.
de.eshg.sti-protection.opening-hours.sex_work.en[0]=By appointment only.

de.eshg.sti-protection.opening-hours.hiv_sti_consultation.de[0]=Nur nach Terminabsprache.
de.eshg.sti-protection.opening-hours.hiv_sti_consultation.en[0]=By appointment only.

eshg.citizen-portal.reverse-proxy.url=http://localhost:4001

de.eshg.privacy-documents.enabled=false

de.eshg.department-info.use-department-info-from-base-module=true

