spring.datasource.url=jdbc:postgresql://localhost:5445/sti_protection
spring.datasource.username=testuser
spring.datasource.password=testpassword
spring.jpa.hibernate.ddl-auto=create
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:/migrations/changelog.xml

# The port should match the one specified in the configuration annotated with @OpenAPIDefinition.
server.port=8095

logging.level.org.zalando.logbook=TRACE

spring.security.oauth2.client.registration.module-client.client-id=system-sti-protection
spring.security.oauth2.client.registration.module-client.client-secret=password
spring.security.oauth2.client.provider.eshg-keycloak.token-uri=${eshg.keycloak.internal.url}/realms/eshg/protocol/openid-connect/token

de.eshg.lib.appointmentblock.defaultAppointmentTypeConfiguration[CONSULTATION]=10m
eshg.population.sti-protection-procedure=30
