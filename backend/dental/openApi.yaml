openapi: 3.0.1
info:
  description: This is the api for the dental module
  title: Dental Api
  version: "0.1"
servers:
- url: http://localhost:8098
paths:
  /children:
    get:
      operationId: getChildren
      parameters:
      - in: query
        name: yearFilter
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1900
      - in: query
        name: institutionIdFilter
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: groupNameFilter
        required: false
        schema:
          type: string
      - in: query
        name: sortKey
        required: false
        schema:
          $ref: "#/components/schemas/ChildSortKey"
      - in: query
        name: sortDirection
        required: false
        schema:
          $ref: "#/components/schemas/SortDirection"
      - in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetChildrenResponse"
          description: OK
      tags:
      - Child
    post:
      operationId: createChild
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateChildResponse"
          description: OK
      tags:
      - Child
  /children/import/{institutionId}:
    post:
      operationId: importXlsx
      parameters:
      - in: path
        name: institutionId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: schoolYear
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1900
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      summary: Upload an XLSX file to create multiple children.
      tags:
      - Child
  /children/{childId}:
    get:
      operationId: getChild
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChildDetails"
          description: OK
      tags:
      - Child
  /children/{childId}/examination:
    post:
      operationId: createExamination
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Examination"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChildDetails"
          description: OK
      tags:
      - Child
  /prophylaxis-sessions:
    get:
      operationId: getProphylaxisSessions
      parameters:
      - in: query
        name: sortKey
        required: false
        schema:
          $ref: "#/components/schemas/ProphylaxisSessionSortKey"
      - in: query
        name: sortDirection
        required: false
        schema:
          $ref: "#/components/schemas/SortDirection"
      - in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProphylaxisSessionResponse"
          description: OK
      tags:
      - ProphylaxisSession
    post:
      operationId: createProphylaxisSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProphylaxisSessionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateProphylaxisSessionResponse"
          description: OK
      tags:
      - ProphylaxisSession
  /test-helper/population:
    post:
      operationId: populateDefaults
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefaultPopulationResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/population/children:
    post:
      operationId: populateChildren
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChildrenPopulationResult"
          description: OK
      tags:
      - TestHelper
  /test-helper/population/prophylaxis-sessions:
    post:
      operationId: populateProphylaxisSessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProphylaxisSessionPopulationResult"
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor:
    post:
      operationId: interceptNextRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertRequestInterceptionTestHelperRequest"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/barriers:
    post:
      operationId: addBarrier
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperInterceptionRequestFilter"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddBarrierTestHelperResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/barriers/{barrierId}/await:
    post:
      operationId: awaitBarrier
      parameters:
      - in: path
        name: barrierId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: timeoutInMillis
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/reset:
    post:
      operationId: resetInterceptionsAndBarriers
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/reset:
    post:
      operationId: reset
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/set-clock:
    patch:
      operationId: setClock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperClockSetRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/wind-clock:
    patch:
      operationId: windClockForward
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperClockWindForwardRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
components:
  schemas:
    AddBarrierTestHelperResponse:
      type: object
      properties:
        barrierId:
          type: integer
          format: int64
          minimum: 1
      required:
      - barrierId
    Address:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
      required:
      - '@type'
    Child:
      type: object
      properties:
        dateOfBirth:
          type: string
          format: date
        firstName:
          type: string
        gender:
          $ref: "#/components/schemas/Gender"
        groupName:
          type: string
        id:
          type: string
          format: uuid
        institution:
          $ref: "#/components/schemas/Institution"
        lastName:
          type: string
        year:
          type: integer
          format: int32
      required:
      - dateOfBirth
      - firstName
      - gender
      - groupName
      - id
      - institution
      - lastName
      - year
    ChildDetails:
      type: object
      properties:
        contactAddress:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        countryOfBirth:
          $ref: "#/components/schemas/CountryCode"
        dateOfBirth:
          type: string
          format: date
        differentBillingAddress:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        emailAddresses:
          type: array
          items:
            type: string
            maxLength: 254
            minLength: 6
        examinations:
          type: array
          items:
            $ref: "#/components/schemas/Examination"
        fileStateId:
          type: string
          format: uuid
        fileStateOutdated:
          type: boolean
        firstName:
          type: string
          maxLength: 80
          minLength: 1
        gender:
          $ref: "#/components/schemas/Gender"
        groupName:
          type: string
        id:
          type: string
          format: uuid
        institution:
          $ref: "#/components/schemas/Institution"
        lastName:
          type: string
          maxLength: 120
          minLength: 1
        nameAtBirth:
          type: string
          maxLength: 40
          minLength: 1
        phoneNumbers:
          type: array
          items:
            type: string
            maxLength: 23
            minLength: 1
        placeOfBirth:
          type: string
          maxLength: 50
          minLength: 1
        salutation:
          $ref: "#/components/schemas/Salutation"
        title:
          type: string
          maxLength: 119
          minLength: 1
        version:
          type: integer
          format: int64
        year:
          type: integer
          format: int32
      required:
      - dateOfBirth
      - emailAddresses
      - examinations
      - fileStateId
      - fileStateOutdated
      - firstName
      - gender
      - groupName
      - id
      - institution
      - lastName
      - phoneNumbers
      - salutation
      - version
      - year
    ChildSortKey:
      type: string
      enum:
      - ID
      - DATE_OF_BIRTH
      - FIRST_NAME
      - LAST_NAME
      - YEAR
      - GROUP_NAME
    ChildrenPopulationResult:
      type: object
      properties:
        children:
          type: array
          items:
            $ref: "#/components/schemas/CreateChildResponse"
        count:
          type: integer
          format: int64
      required:
      - children
      - count
    CountryCode:
      type: string
      description: List of country codes in ISO 3166-1 alpha-2 format.
