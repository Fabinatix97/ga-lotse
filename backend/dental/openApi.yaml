    CreateChildRequest:
      type: object
      properties:
        dateOfBirth:
          type: string
          format: date
        firstName:
          type: string
          maxLength: 80
          minLength: 1
        gender:
          $ref: "#/components/schemas/Gender"
        groupName:
          type: string
        institutionId:
          type: string
          format: uuid
        lastName:
          type: string
          maxLength: 120
          minLength: 1
        year:
          type: integer
          format: int32
      required:
      - dateOfBirth
      - firstName
      - groupName
      - institutionId
      - lastName
      - year
    CreateChildResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Id of the child.
          example: ae9831d4-dc25-48d8-9bfe-4c0b54bfb2c1
      required:
      - id
    CreateProphylaxisSessionRequest:
      type: object
      properties:
        dateAndTime:
          type: string
          format: date-time
        institutionId:
          type: string
          format: uuid
      required:
      - dateAndTime
      - institutionId
    CreateProphylaxisSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Id of the prophylaxis session.
          example: ae9831d4-dc25-48d8-9bfe-4c0b54bfb2c1
      required:
      - id
    DefaultPopulationResponse:
      type: object
      properties:
        populations:
          type: array
          items:
            $ref: "#/components/schemas/Population"
    DomesticAddress:
      type: object
      allOf:
      - $ref: "#/components/schemas/Address"
      - type: object
        properties:
          addressAddition:
            type: string
            description: A descriptive addition to the address.
            example: 2.OG links
            maxLength: 100
            minLength: 1
          city:
            type: string
            description: The city in which the address is located.
            example: Berlin
            maxLength: 50
            minLength: 1
          country:
            $ref: "#/components/schemas/CountryCode"
          differentName:
            type: string
            description: "If the name of the addressee deviates from the present name\
              \ of a Person or Facility, e.g. when a company pays the bill for its\
              \ employee or a parent company shall be contacted instead of its subsidiary."
            example: Parent Company AG
            maxLength: 200
            minLength: 1
          houseNumber:
            type: string
            description: "The house number of the address, including extensions."
            example: 1a
            maxLength: 11
            minLength: 1
          postalCode:
            type: string
            description: The postal code of the address.
            example: "10115"
            maxLength: 20
            minLength: 1
          street:
            type: string
            description: "The name of the street of the address, without the house\
              \ number."
            example: Beispielweg
            maxLength: 55
            minLength: 1
      description: A usual domestic address.
      required:
      - city
      - country
      - postalCode
      - street
    Examination:
      type: object
      properties:
        examinationDate:
          type: string
          format: date
        note:
          type: string
      required:
      - examinationDate
    Gender:
      type: string
      description: The list of genders as specified in the German Personenstandsgesetz.
      enum:
      - NOT_SPECIFIED
      - DIVERSE
      - FEMALE
      - MALE
    GetChildrenResponse:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        totalNumberOfElements:
          type: integer
          format: int64
      required:
      - elements
      - totalNumberOfElements
    GetProphylaxisSessionResponse:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/ProphylaxisSession"
        totalNumberOfElements:
          type: integer
          format: int64
      required:
      - elements
      - totalNumberOfElements
    HttpMethod:
      type: string
      enum:
      - GET
      - HEAD
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - TRACE
    ImportStatistics:
      type: object
      properties:
        created:
          type: integer
          format: int32
          minimum: 0
        duplicated:
          type: integer
          format: int32
          minimum: 0
        failed:
          type: integer
          format: int32
          minimum: 0
        mergeFailed:
          type: integer
          format: int32
          minimum: 0
        merged:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int32
          minimum: 0
      required:
      - created
      - duplicated
      - failed
      - mergeFailed
      - merged
      - total
    InsertRequestInterceptionTestHelperRequest:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/TestHelperInterceptionRequestFilter"
        type:
          $ref: "#/components/schemas/InterceptionType"
      required:
      - type
    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    InterceptionType:
      type: string
      enum:
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - INTERNAL_SERVER_ERROR
    Population:
      type: object
      properties:
        numberOfPopulatedEntities:
          type: integer
          format: int32
        populatorName:
          type: string
        totalNumberOfEntities:
          type: integer
          format: int64
      required:
      - numberOfPopulatedEntities
      - totalNumberOfEntities
    PopulationRequest:
      type: object
      properties:
        numberOfEntitiesToPopulate:
          type: integer
          format: int32
      required:
      - numberOfEntitiesToPopulate
    PostboxAddress:
      type: object
      allOf:
      - $ref: "#/components/schemas/Address"
      - type: object
        properties:
          city:
            type: string
            description: The city in which the address is located.
            example: Berlin
            maxLength: 50
            minLength: 1
          country:
            $ref: "#/components/schemas/CountryCode"
          differentName:
            type: string
            description: "If the name of the addressee deviates from the present name\
              \ of a Person or Facility, e.g. when a company pays the bill for its\
              \ employee or a parent company shall be contacted instead of its subsidiary."
            example: Parent Company AG
            maxLength: 200
            minLength: 1
          postalCode:
            type: string
            description: The postal code of the address.
            example: "10115"
            maxLength: 20
            minLength: 1
          postbox:
            type: string
            description: The number (or name) of the postbox.
            example: "123"
            maxLength: 21
            minLength: 1
      description: An address which is a postbox.
      required:
      - city
      - country
      - postalCode
      - postbox
    ProphylaxisSession:
      type: object
      properties:
        dateAndTime:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        institution:
          $ref: "#/components/schemas/Institution"
      required:
      - dateAndTime
      - id
      - institution
    ProphylaxisSessionPopulationResult:
      type: object
      properties:
        count:
          type: integer
          format: int64
        prophylaxisSessions:
          type: array
          items:
            $ref: "#/components/schemas/CreateProphylaxisSessionResponse"
      required:
      - count
      - prophylaxisSessions
    ProphylaxisSessionSortKey:
      type: string
      enum:
      - ID
    Salutation:
      type: string
      description: A list of categories for the salutation from which specific salutation
        phrases can be derived. The choice of salutation is free for every citizen
        and not dependent on gender.
      enum:
      - NOT_SPECIFIED
      - NEUTRAL
      - FEMALE
      - MALE
    SortDirection:
      type: string
      enum:
      - ASC
      - DESC
    TestHelperClockSetRequest:
      type: object
      properties:
        newInstant:
          type: string
          format: date-time
      required:
      - newInstant
    TestHelperClockUpdateResponse:
      type: object
      properties:
        instant:
          type: string
          format: date-time
      required:
      - instant
    TestHelperClockWindForwardRequest:
      type: object
      properties:
        days:
          type: integer
          format: int32
          minimum: 0
        hours:
          type: integer
          format: int32
          minimum: 0
        minutes:
          type: integer
          format: int32
          minimum: 0
        months:
          type: integer
          format: int32
          minimum: 0
        seconds:
          type: integer
          format: int32
          minimum: 0
        weeks:
          type: integer
          format: int32
          minimum: 0
      required:
      - days
      - hours
      - minutes
      - months
      - seconds
      - weeks
    TestHelperInterceptionRequestFilter:
      type: object
      properties:
        httpMethodFilter:
          $ref: "#/components/schemas/HttpMethod"
        queryPatternFilter:
          type: string
        urlPatternFilter:
          type: string
