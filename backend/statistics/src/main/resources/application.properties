# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5440/statistics
spring.datasource.username=testuser
spring.datasource.password=testpassword
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=250

# Enable explicitly since we disable it by default via common-persistence.properties
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/migrations/changelog.xml

server.port=8087

logging.level.org.zalando.logbook=TRACE

spring.security.oauth2.client.registration.module-client.client-id=system-statistics
spring.security.oauth2.client.registration.module-client.client-secret=password
spring.security.oauth2.client.provider.eshg-keycloak.token-uri=${eshg.keycloak.internal.url}/realms/eshg/protocol/openid-connect/token

eshg.statistics.business-module.sensitive-data-permissions[SCHOOL_ENTRY]=SCHOOL_ENTRY_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[INSPECTION]=INSPECTION_PROCEDURE_EDIT
eshg.statistics.business-module.sensitive-data-permissions[DENTAL]=DENTAL_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[OFFICIAL_MEDICAL_SERVICE]=OFFICIAL_MEDICAL_SERVICE_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[STI_PROTECTION]=STI_PROTECTION_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[TRAVEL_MEDICINE]=TRAVEL_MEDICINE_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[MEASLES_PROTECTION]=MEASLES_PROTECTION_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[MEDS_ABROAD]=MEDS_ABROAD_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[MEDICAL_REGISTRY]=MEDICAL_REGISTRY_ADMIN
eshg.statistics.business-module.sensitive-data-permissions[PROSTITUTE_PROTECTION]=PROSTITUTE_PROTECTION_ADMIN

logging.level.de.eshg.statistics=DEBUG
