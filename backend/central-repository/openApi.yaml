openapi: 3.0.1
info:
  description: This is the api for Central Repository
  title: Central Repository Api
  version: "0.1"
servers:
- url: http://localhost:8091
paths:
  /test-helper/population:
    post:
      operationId: populateDefaults
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefaultPopulationResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor:
    post:
      operationId: interceptNextRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertRequestInterceptionTestHelperRequest"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/barriers:
    post:
      operationId: addBarrier
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperInterceptionRequestFilter"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddBarrierTestHelperResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/barriers/{barrierId}/await:
    post:
      operationId: awaitBarrier
      parameters:
      - in: path
        name: barrierId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: timeoutInMillis
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/request-interceptor/reset:
    post:
      operationId: resetInterceptionsAndBarriers
      responses:
        "200":
          description: OK
      tags:
      - TestHelper
  /test-helper/reset:
    post:
      operationId: reset
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/set-clock:
    patch:
      operationId: setClock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperClockSetRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
  /test-helper/wind-clock:
    patch:
      operationId: windClockForward
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestHelperClockWindForwardRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestHelperClockUpdateResponse"
          description: OK
      tags:
      - TestHelper
  /versioned/{moduleName}/{objectName}:
    post:
      operationId: createEntry
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataResponse"
          description: Returns the metadata for the created entry containing the new
            id and version
      summary: Create entry and get the metadata for the created entry
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/metadata:
    get:
      operationId: getMetadataOfVersionsWithModuleAndObjectName
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: query
        name: versions
        required: false
        schema:
          $ref: "#/components/schemas/VersionFilterType"
      - in: query
        name: deleted
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: tags
        required: false
        schema:
          type: string
      - in: query
        name: category
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataListResponse"
          description: |
            Returns the metadata of all or the newest version, given they have the supplied names.
            The objectName can be * to include all objects whatever their objectName.

            **Filters**:
            * If versions is not supplied, this will return all versions. It can be set to NEWEST.
            * If deleted is not specified, this will return only versions, which are not deleted.
            * If deleted is set to true, this will return only versions, which are deleted.
            * If tags or category are not supplied, this will return results with any tag or category.
            * If tags is an empty string, this will return all results with an empty tags field.
      summary: Get metadata for multiple versions of objects with supplied names
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/{id}:
    delete:
      operationId: setEntryAsDeleted
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: If the entry was successfully set as deleted
      summary: Set the specified entry and thus all its versions as deleted
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/{id}/metadata:
    get:
      operationId: getMetadataOfVersionsWithId
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: versions
        required: false
        schema:
          $ref: "#/components/schemas/VersionFilterType"
      - in: query
        name: deleted
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataListResponse"
          description: |
            Returns the metadata of all or the newest version, given they have the supplied names and id.

            **Filters**:
            * If versions is not supplied, this will return all versions. It can be set to NEWEST.
            * If deleted is not specified, this will return only versions, which are not deleted.
            * If deleted is set to true, this will return only versions, which are deleted.
      summary: Get metadata for multiple versions of an object
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/{id}/{basedOnVersion}:
    post:
      operationId: createNewVersionForEntry
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: basedOnVersion
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataResponse"
          description: Returns the metadata for the new version
      summary: Create new version and get the metadata for it
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/{id}/{basedOnVersion}/metadata:
    post:
      operationId: createNewVersionOnlyChangeMetadataForEntry
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: basedOnVersion
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataResponse"
          description: Returns the metadata for the new version
      summary: Create new version with only metadata being modified and get the new
        metadata for it
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/{id}/{version}:
    delete:
      operationId: setOneVersionOfAnEntryAsDeleted
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: version
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: If the version of the entry was successfully set as deleted
      summary: Set the specified version of the specified entry as deleted
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/{id}/{version}/content:
    get:
      operationId: getContentOfOneVersion
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: version
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
          description: "Returns the content of the specified version, which has the\
            \ supplied names and id"
      summary: Get content for a specific version of an object
      tags:
      - CentralRepository
  /versioned/{moduleName}/{objectName}/{id}/{version}/metadata:
    get:
      operationId: getMetadataOfOneVersion
      parameters:
      - in: path
        name: moduleName
        required: true
        schema:
          type: string
      - in: path
        name: objectName
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: version
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataResponse"
          description: "Returns the metadata of the specified version, which has the\
            \ supplied names and id"
      summary: Get metadata for a specific version of an object
      tags:
      - CentralRepository
components:
  schemas:
    AddBarrierTestHelperResponse:
      type: object
      properties:
        barrierId:
          type: integer
          format: int64
          minimum: 1
      required:
      - barrierId
    DefaultPopulationResponse:
      type: object
      properties:
        populations:
          type: array
          items:
            $ref: "#/components/schemas/Population"
    HttpMethod:
      type: string
      enum:
      - GET
      - HEAD
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - TRACE
    InsertRequestInterceptionTestHelperRequest:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/TestHelperInterceptionRequestFilter"
        type:
          $ref: "#/components/schemas/InterceptionType"
      required:
      - type
    InterceptionType:
      type: string
      enum:
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - INTERNAL_SERVER_ERROR
    MetadataListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MetadataResponse"
    MetadataRequest:
      type: object
      properties:
        category:
          type: string
        changeLog:
          type: string
        contact:
          type: string
        description:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
            pattern: "^(?!\\s*$)[^,]+$"
      required:
      - category
      - name
    MetadataResponse:
      type: object
      properties:
        category:
          type: string
        changeLog:
          type: string
        contact:
          type: string
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          type: string
        description:
          type: string
        id:
          type: integer
          format: int64
        moduleName:
          type: string
        name:
          type: string
        objectName:
          type: string
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int32
      required:
      - category
      - contentType
      - createdAt
      - createdBy
      - id
      - moduleName
      - name
      - objectName
      - tags
      - version
    Population:
      type: object
      properties:
        numberOfPopulatedEntities:
          type: integer
          format: int32
        populatorName:
          type: string
        totalNumberOfEntities:
          type: integer
          format: int64
      required:
      - numberOfPopulatedEntities
      - totalNumberOfEntities
    StreamingResponseBody:
      type: object
    TestHelperClockSetRequest:
      type: object
      properties:
        newInstant:
          type: string
          format: date-time
      required:
      - newInstant
    TestHelperClockUpdateResponse:
      type: object
      properties:
        instant:
          type: string
          format: date-time
      required:
      - instant
    TestHelperClockWindForwardRequest:
      type: object
      properties:
        days:
          type: integer
          format: int32
          minimum: 0
        hours:
          type: integer
          format: int32
          minimum: 0
        minutes:
          type: integer
          format: int32
          minimum: 0
        months:
          type: integer
          format: int32
          minimum: 0
        seconds:
          type: integer
          format: int32
          minimum: 0
        weeks:
          type: integer
          format: int32
          minimum: 0
      required:
      - days
      - hours
      - minutes
      - months
      - seconds
      - weeks
    TestHelperInterceptionRequestFilter:
      type: object
      properties:
        httpMethodFilter:
          $ref: "#/components/schemas/HttpMethod"
        queryPatternFilter:
          type: string
        urlPatternFilter:
          type: string
    VersionFilterType:
      type: string
      enum:
      - ALL
      - NEWEST
