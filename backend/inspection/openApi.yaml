  /procedures:
    get:
      description: |
        GET operation for retrieving basic information of procedures for the procedure overview.
      operationId: getProcedures
      parameters:
      - description: |
          Only procedures are returned where the assigneeId of at least one task equals the `assignedToId`.
          If not submitted, no filtering takes place.
        in: query
        name: assignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Only procedures are returned where the assigneeId of none of the task equals `notAssignedToId`.
          If not submitted, no filtering takes place.
        in: query
        name: notAssignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Only procedures are returned where the user is or was assigned to at least one task (at least one assigneeId equals `onceAssignedToId` in taskHistory for at least one task).
          If not submitted, no filtering takes place.
        in: query
        name: onceAssignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Filter logic:
          - In case of `true` only procedures are returned where all tasks are unassigned
          - In case of `false` only procedures are returned which have at least one assigned task
          - If not submitted, no filtering takes place
        in: query
        name: unassigned
        required: false
        schema:
          type: boolean
      - description: |
          Filter logic:
          - If `procedureType` is submitted, only procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place
        in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `procedureStatus` is submitted, only procedures are returned which have one of the submitted statuses.
          - If not submitted, no filtering takes place
        in: query
        name: procedureStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureStatus"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `createdInYear` is set, only procedures are returned which were created in that year
          - If not submitted, no filtering takes place
        in: query
        name: createdInYear
        required: false
        schema:
          type: string
      - description: |
          The following sorting options are available:
          - `CREATED_AT`: Sorting by createdAt attribute
          - `MODIFIED_AT`: Sorting by modifiedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProceduresResponse"
          description: the users recent procedures
      summary: Get recent procedures for user
      tags:
