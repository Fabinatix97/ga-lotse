openapi: 3.0.1
info:
  description: This is the api for the inspection module
  title: Inspection Module Api
  version: "0.1"
servers:
- url: http://localhost:8081
paths:
  /approval-requests/{approvalRequestId}:
    get:
      operationId: getApprovalRequest
      parameters:
      - in: path
        name: approvalRequestId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: OK
      tags:
      - ApprovalRequest
  /approval-requests/{approvalRequestId}/decision:
    put:
      operationId: decideApprovalRequest
      parameters:
      - in: path
        name: approvalRequestId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - ApprovalRequest
  /archiving/config:
    get:
      operationId: getArchivingConfiguration
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetArchivingConfigurationResponse"
          description: OK
      summary: Get archiving configuration
      tags:
      - Archiving
  /archiving/procedures:
    get:
      operationId: getArchivableProcedures
      parameters:
      - description: |
          Filter logic:
          - If `procedureType` is submitted, only procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place
        in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `closedAtDay` is set, only procedures are returned which were closed at that date
          - If not submitted, no filtering takes place
        in: query
        name: closedAtDay
        required: false
        schema:
          type: string
          format: date
      - description: |
          Filter logic:
          - If `defaultArchivingRelevance` is submitted, only procedures are returned which have one of the submitted default archiving relevances.
          - If not submitted, no filtering takes place
        in: query
        name: defaultArchivingRelevance
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ArchivingRelevance"
          uniqueItems: true
      - description: |
          The following sorting options are available:
          - `CLOSED_AT`: Sorting by closedAt attribute
          - `PROCEDURE_TYPE`: Sorting by procedureType attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetArchivableProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetArchivableProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetArchivableProceduresResponse"
          description: OK
      summary: Get archivable procedures
      tags:
      - Archiving
  /archiving/procedures/bulk-update-archiving-relevance:
    post:
      operationId: bulkUpdateProceduresArchivingRelevance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateProceduresArchivingRelevanceRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkUpdateProceduresArchivingRelevanceResponse"
          description: OK
      summary: Bulk update procedures archiving relevance
      tags:
      - Archiving
  /archiving/relevant-procedures:
    get:
      operationId: getRelevantArchivableProcedures
      parameters:
      - description: |
          Filter logic:
          - If `closedAtDay` is set, only procedures are returned which were closed at that date
          - If not submitted, no filtering takes place
        in: query
        name: closedAtDay
        required: false
        schema:
          type: string
          format: date
      - description: |
          Filter logic:
          - If `exported` is true, only procedures are returned which have already been exported.
          - If `exported` is false, only procedures are returned which have not been exported, yet.
          - If not submitted, no filtering takes place
        in: query
        name: exported
        required: false
        schema:
          type: boolean
      - description: |
          The following sorting options are available:
          - `CLOSED_AT`: Sorting by closedAt attribute
          - `EXPORTED_AT`: Sorting by exportedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetRelevantArchivableProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetRelevantArchivableProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRelevantArchivableProceduresResponse"
          description: OK
      summary: Get relevant archivable procedures
      tags:
      - Archiving
  /archiving/relevant-procedures/export:
    post:
      operationId: exportRelevantProcedures
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportArchivingRelevantProceduresRequest"
        required: true
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: OK
      tags:
      - Archiving
  /checklists/definitions:
    get:
      operationId: getChecklistDefinitions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinitionsResponse"
          description: OK
      summary: "Get an overview of all checklist definitions, without version details"
      tags:
      - ChecklistDefinition
    post:
      description: "This also creates a first <i>version</i> of the definition. Versions\
        \ are numbered with integers, starting at 1."
      operationId: createNewChecklistDefinition
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNewChecklistDefinitionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinition"
          description: OK
      summary: Add a new checklist definition
      tags:
      - ChecklistDefinition
  /checklists/definitions/central-repository:
    delete:
      operationId: deleteChecklistDefinitionFromCentralRepo
      parameters:
      - in: query
        name: isCoreChecklist
        required: true
        schema:
          type: boolean
      - in: query
        name: repositoryID
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: repositoryVersion
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
      summary: Delete the checklist definition from the central repository
      tags:
      - ChecklistDefinitionCentralRepo
    get:
      operationId: getNewestChecklistDefinitionsFromCentralRepo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNewestChecklistDefinitionsCentralRepoResponse"
          description: OK
      summary: Get metadata of the newest checklist definitions from the central repository
      tags:
      - ChecklistDefinitionCentralRepo
  /checklists/definitions/central-repository/content:
    get:
      operationId: getChecklistDefinitionFromCentralRepo
      parameters:
      - in: query
        name: repositoryID
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: repositoryVersion
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: isCoreChecklist
        required: true
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChecklistDefinitionCentralRepoResponse"
          description: OK
      summary: Get the given central repository checklist definition
      tags:
      - ChecklistDefinitionCentralRepo
  /checklists/definitions/central-repository/sync:
    post:
      operationId: updateChecklistDefinitionsFromCentralRepo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistDefinitionFromCentralRepoUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinitionCentralRepoResponse"
          description: OK
      summary: Adds the given checklist definition from the central repository to
        the local checklist definitions
      tags:
      - ChecklistDefinitionCentralRepo
  /checklists/definitions/central-repository/{cldId}/{cldVersion}:
    post:
      operationId: addChecklistDefinitionToCentralRepo
      parameters:
      - in: path
        name: cldId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: cldVersion
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistDefinitionCentralRepoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinitionCentralRepoResponse"
          description: OK
      summary: Creates the given checklist definition version in the central repository
      tags:
      - ChecklistDefinitionCentralRepo
    put:
      operationId: updateChecklistDefinitionToCentralRepo
      parameters:
      - in: path
        name: cldId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: cldVersion
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistDefinitionCentralRepoUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinitionCentralRepoResponse"
          description: OK
      summary: Adds the given checklist definition version onto the existing checklist
        definition in the central repository
      tags:
      - ChecklistDefinitionCentralRepo
  /checklists/definitions/versions/{id}:
    put:
      operationId: editDraftChecklistDefinitionVersion
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistDefinitionVersionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinitionVersion"
          description: OK
      summary: Edits an existing checklist definition version in draft mode
      tags:
      - ChecklistDefinition
  /checklists/definitions/versions/{versionId}:
    get:
      operationId: getChecklistDefinitionVersion
      parameters:
      - in: path
        name: versionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinitionVersion"
          description: OK
      summary: Get a certain version of a checklist definition
      tags:
      - ChecklistDefinition
  /checklists/definitions/{id}:
    post:
      operationId: addChecklistDefinitionVersion
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistDefinitionVersionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinitionVersion"
          description: OK
      summary: Add a new version to a checklist definition
      tags:
      - ChecklistDefinition
  /checklists/definitions/{id}/versions:
    get:
      operationId: getChecklistDefinitionVersions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistDefinition"
          description: OK
      summary: "Get all versions of a checklist definition, ie. the history of changes"
      tags:
      - ChecklistDefinition
  /checklists/file/upload:
    patch:
      operationId: checklistUploadFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                uploadMediaFileRequest:
                  $ref: "#/components/schemas/UploadMediaFileRequest"
              required:
              - file
              - uploadMediaFileRequest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateChecklistResponse"
          description: OK
      summary: Upload new file for a checklist
      tags:
      - Checklist
  /checklists/file/{externalId}:
    get:
      operationId: checklistGetFile
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          description: OK
      summary: Get a file by its external ID
      tags:
      - Checklist
  /checklists/{inspectionExternalId}:
    get:
      operationId: getChecklists
      parameters:
      - in: path
        name: inspectionExternalId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChecklistsResponse"
          description: OK
      summary: Load the checklists for the inspection with the given inspectionExternalId
      tags:
      - Checklist
  /checklists/{inspectionExternalId}/checklist/{checklistId}:
    patch:
      operationId: updateChecklist
      parameters:
      - in: path
        name: inspectionExternalId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: checklistId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateChecklistResponse"
          description: OK
      summary: Update the data for a checklist of an inspection
      tags:
      - Checklist
  /checklists/{inspectionExternalId}/file/{externalId}:
    delete:
      operationId: checklistDeleteFile
      parameters:
      - in: path
        name: inspectionExternalId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: externalId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Delete a file by inspection and its external ID
      tags:
      - Checklist
  /editor/{editorId}:
    get:
      operationId: loadEditor
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Editor"
          description: OK
      summary: Get editor content
      tags:
      - Editor
  /editor/{editorId}/element:
    post:
      operationId: insertEditorElement
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertEditorRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ModifyEditorElementResponse"
          description: OK
      summary: Insert an editor element
      tags:
      - Editor
  /editor/{editorId}/element/{elementId}:
    delete:
      operationId: deleteEditorElement
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: elementId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Delete an editor element
      tags:
      - Editor
    patch:
      operationId: updateEditorElement
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: elementId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEditorRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ModifyEditorElementResponse"
          description: OK
      summary: Update an editor element
      tags:
      - Editor
  /facilities:
    post:
      operationId: addFacility
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspAddFacilityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspAddFacilityResponse"
          description: OK
      summary: Add a new facility
      tags:
      - Facility
  /facilities/base:
    post:
      operationId: linkBaseFacility
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspLinkBaseFacilityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspLinkBaseFacilityResponse"
          description: OK
      summary: Get an existing or create a new inspection facility based on facility
        of the base module
      tags:
      - Facility
  /facilities/pending:
    get:
      operationId: getPendingFacilities
      parameters:
      - in: query
        name: kind
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/InspPendingFacilityKind"
          uniqueItems: true
      - in: query
        name: name
        required: false
        schema:
          type: string
      - in: query
        name: postalCode
        required: false
        schema:
          type: string
      - in: query
        name: city
        required: false
        schema:
          type: string
      - in: query
        name: street
        required: false
        schema:
          type: string
      - in: query
        name: objectTypeId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureStatus"
          uniqueItems: true
      - in: query
        name: type
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/InspectionType"
          uniqueItems: true
      - in: query
        name: phase
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/InspectionPhase"
          uniqueItems: true
      - in: query
        name: isBefore
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: isAfter
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          default: 0
          maximum: 200
          minimum: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          default: 25
          maximum: 2000
          minimum: 1
      - description: list of sort criteria
        example: ?sort=postalCode|asc&sort=status|desc
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspPendingFacilitiesOverviewResponse"
          description: OK
      summary: get overview of facilities with pending inspections
      tags:
      - Facility
  /facilities/websearch:
    get:
      operationId: getWebSearchOverview
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchOverviewResponse"
          description: OK
      summary: get all facility websearch definitions
      tags:
      - WebSearch
    post:
      description: "This does not start the websearch automatically. Use POST /{id}/start\
        \ to start it. The initial status of the websearch is IDLE."
      operationId: createWebSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearch"
          description: OK
      summary: create a new websearch for facilities
      tags:
      - WebSearch
  /facilities/websearch/entry/{entryId}:
    get:
      operationId: getWebSearchEntryById
      parameters:
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchEntry"
          description: OK
      summary: get a facility websearch entry
      tags:
      - WebSearch
    patch:
      operationId: updateWebSearchEntry
      parameters:
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebSearchEntryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchEntry"
          description: OK
      summary: "update a websearch entry, e.g. for setting the ignored flag"
      tags:
      - WebSearch
  /facilities/websearch/{id}:
    delete:
      operationId: deleteWebSearchById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: delete a facility websearch definition
      tags:
      - WebSearch
    get:
      operationId: getWebSearchById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearch"
          description: OK
      summary: get a facility websearch definition
      tags:
      - WebSearch
    put:
      description: "This does not start the updated websearch automatically. It will\
        \ be started by a background job at a configurable time. Use POST /{id}/start\
        \ to start it manually."
      operationId: updateWebSearchById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearch"
          description: OK
      summary: update a facility websearch definition
      tags:
      - WebSearch
  /facilities/websearch/{id}/search:
    get:
      operationId: search
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - in: query
        name: name
