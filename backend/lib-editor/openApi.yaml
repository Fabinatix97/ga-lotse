openapi: 3.0.1
info:
  description: This is the API for the editor library 'lib-editor'
  title: The editor library API
  version: "0.1"
servers:
- url: http://localhost:8080
paths:
  /editor/{editorId}:
    get:
      operationId: loadEditor
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Editor"
          description: OK
      summary: Get editor content
      tags:
      - Editor
  /editor/{editorId}/element:
    post:
      operationId: insertEditorElement
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertEditorRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ModifyEditorElementResponse"
          description: OK
      summary: Insert an editor element
      tags:
      - Editor
  /editor/{editorId}/element/{elementId}:
    delete:
      operationId: deleteEditorElement
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: elementId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Delete an editor element
      tags:
      - Editor
    patch:
      operationId: updateEditorElement
      parameters:
      - in: path
        name: editorId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: elementId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEditorRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ModifyEditorElementResponse"
          description: OK
      summary: Update an editor element
      tags:
      - Editor
  /textblocks:
    get:
      operationId: getTextBlocks
      parameters:
      - in: query
        name: searchQuery
        required: false
        schema:
          type: string
      - in: query
        name: sortKey
        required: false
        schema:
          $ref: "#/components/schemas/TextBlockSortKey"
      - in: query
        name: sortDirection
        required: false
        schema:
          $ref: "#/components/schemas/SortDirection"
      - in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetTextBlocksResponse"
          description: OK
      summary: "Get all text blocks, filtered and paginated"
      tags:
      - TextBlock
    post:
      operationId: createTextBlock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextBlockRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TextBlock"
          description: OK
      summary: Creates a new text block
      tags:
      - TextBlock
  /textblocks/{textBlockId}:
    delete:
      operationId: deleteTextBlock
      parameters:
      - in: path
        name: textBlockId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Delete a text block
      tags:
      - TextBlock
    get:
      operationId: getTextBlock
      parameters:
      - in: path
        name: textBlockId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TextBlock"
          description: OK
      summary: Get a text block by its id
      tags:
      - TextBlock
    patch:
      operationId: updateTextBlock
      parameters:
      - in: path
        name: textBlockId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextBlockRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TextBlock"
          description: OK
      summary: Update the data for a text block
      tags:
      - TextBlock
components:
  schemas:
    Editor:
      type: object
      properties:
        editorBody:
          $ref: "#/components/schemas/EditorBody"
        id:
          type: string
          format: uuid
      required:
      - editorBody
      - id
    EditorBody:
      type: object
      properties:
        elements:
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/EditorElementAudios"
            - $ref: "#/components/schemas/EditorElementChapter"
            - $ref: "#/components/schemas/EditorElementFullTextBlock"
            - $ref: "#/components/schemas/EditorElementImages"
            - $ref: "#/components/schemas/EditorElementQA"
            - $ref: "#/components/schemas/EditorElementSection"
            - $ref: "#/components/schemas/EditorElementSeparator"
            - $ref: "#/components/schemas/EditorElementText"
            - $ref: "#/components/schemas/EditorElementTextBlock"
            - $ref: "#/components/schemas/EditorElementTopLevelTitle"
      required:
      - elements
    EditorElement:
      type: object
      discriminator:
        mapping:
          AUDIOS: "#/components/schemas/EditorElementAudios"
          CHAPTER: "#/components/schemas/EditorElementChapter"
          FULL_TEXT_BLOCK: "#/components/schemas/EditorElementFullTextBlock"
          IMAGES: "#/components/schemas/EditorElementImages"
          QUESTION_AND_ANSWERS: "#/components/schemas/EditorElementQA"
          SECTION: "#/components/schemas/EditorElementSection"
          SEPARATOR: "#/components/schemas/EditorElementSeparator"
          TEXT: "#/components/schemas/EditorElementText"
          TEXT_BLOCK: "#/components/schemas/EditorElementTextBlock"
          TOPLEVEL_TITLE: "#/components/schemas/EditorElementTopLevelTitle"
        propertyName: '@type'
      properties:
        '@type':
          type: string
        deletable:
          type: boolean
        editable:
          type: boolean
        highlighted:
          type: boolean
        id:
          type: string
          format: uuid
        moveable:
          type: boolean
        referenceID:
          type: string
          format: uuid
      required:
      - '@type'
      - deletable
      - editable
      - highlighted
      - id
      - moveable
    EditorElementAnswer:
      type: object
      properties:
        answerId:
          type: string
          format: uuid
        answerText:
          type: string
        extraText:
          type: string
        selected:
          type: boolean
      required:
      - answerId
      - answerText
      - selected
    EditorElementAudio:
      type: object
      properties:
        externalId:
          type: string
          format: uuid
        fileDate:
          type: string
          format: date-time
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
      required:
      - externalId
    EditorElementAudios:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          audios:
            type: array
            items:
              $ref: "#/components/schemas/EditorElementAudio"
          title:
            type: string
      required:
      - audios
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - title
    EditorElementChapter:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          title:
            type: string
      required:
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - title
    EditorElementFullTextBlock:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          text:
            type: string
          title:
            type: string
      required:
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - text
      - title
    EditorElementImage:
      type: object
      properties:
        externalId:
          type: string
          format: uuid
        fileDate:
          type: string
          format: date-time
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
      required:
      - externalId
    EditorElementImages:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          images:
            type: array
            items:
              $ref: "#/components/schemas/EditorElementImage"
          title:
            type: string
      required:
      - deletable
      - editable
      - highlighted
      - id
      - images
      - moveable
      - title
    EditorElementQA:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          answers:
            type: array
            items:
              $ref: "#/components/schemas/EditorElementAnswer"
          title:
            type: string
      required:
      - answers
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - title
    EditorElementSection:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          title:
            type: string
      required:
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - title
    EditorElementSeparator:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      required:
      - deletable
      - editable
      - highlighted
      - id
      - moveable
    EditorElementText:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          text:
            type: string
      required:
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - text
    EditorElementTextBlock:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          text:
            type: string
          title:
            type: string
      required:
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - text
      - title
    EditorElementTopLevelTitle:
      type: object
      allOf:
      - $ref: "#/components/schemas/EditorElement"
      - type: object
        properties:
          title:
            type: string
      required:
      - deletable
      - editable
      - highlighted
      - id
      - moveable
      - title
    GetTextBlocksResponse:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/TextBlock"
        totalNumberOfElements:
          type: integer
          format: int64
          minimum: 0
      required:
      - elements
      - totalNumberOfElements
    InsertEditorRequest:
      type: object
      properties:
        editorElement:
          oneOf:
          - $ref: "#/components/schemas/EditorElementAudios"
          - $ref: "#/components/schemas/EditorElementChapter"
          - $ref: "#/components/schemas/EditorElementFullTextBlock"
          - $ref: "#/components/schemas/EditorElementImages"
          - $ref: "#/components/schemas/EditorElementQA"
          - $ref: "#/components/schemas/EditorElementSection"
          - $ref: "#/components/schemas/EditorElementSeparator"
          - $ref: "#/components/schemas/EditorElementText"
          - $ref: "#/components/schemas/EditorElementTextBlock"
          - $ref: "#/components/schemas/EditorElementTopLevelTitle"
        insertAfter:
          type: integer
          format: int32
          minimum: 0
        insertBefore:
          type: integer
          format: int32
          minimum: 0
      required:
      - editorElement
    ModifyEditorElementResponse:
      type: object
      properties:
        element:
          oneOf:
          - $ref: "#/components/schemas/EditorElementAudios"
          - $ref: "#/components/schemas/EditorElementChapter"
          - $ref: "#/components/schemas/EditorElementFullTextBlock"
          - $ref: "#/components/schemas/EditorElementImages"
          - $ref: "#/components/schemas/EditorElementQA"
          - $ref: "#/components/schemas/EditorElementSection"
          - $ref: "#/components/schemas/EditorElementSeparator"
          - $ref: "#/components/schemas/EditorElementText"
          - $ref: "#/components/schemas/EditorElementTextBlock"
          - $ref: "#/components/schemas/EditorElementTopLevelTitle"
      required:
      - element
    MoveOperation:
      type: string
      enum:
      - UP
      - DOWN
    SortDirection:
      type: string
      enum:
      - ASC
      - DESC
    TextBlock:
      type: object
      properties:
        content:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - content
      - id
      - name
    TextBlockRequest:
      type: object
      properties:
        content:
          type: string
        name:
          type: string
      required:
      - content
      - name
    TextBlockSortKey:
      type: string
      enum:
      - NAME
    UpdateEditorRequest:
      type: object
      properties:
        answerId:
          type: string
          format: uuid
        moveOperation:
          $ref: "#/components/schemas/MoveOperation"
        text:
          type: string
        title:
          type: string
