plugins {
    id("eshg.java-lib")
}

dependencies {
    api 'jakarta.validation:jakarta.validation-api'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'io.swagger.core.v3:swagger-annotations-jakarta:latest.release'
    api 'org.springframework:spring-web'

    api project(":lib-commons")

    testImplementation project(':test-commons')
    testRuntimeOnly 'org.hibernate.validator:hibernate-validator'
    testRuntimeOnly 'jakarta.el:jakarta.el-api:6.0.1' // Avoid 6.1.0-M1 (which depends on a "SNAPSHOT" parent project which can not be found, error message: 'Could not find org.eclipse.ee4j:project:2.0.0-SNAPSHOT')
    testRuntimeOnly 'org.glassfish:jakarta.el:latest.release'
}
