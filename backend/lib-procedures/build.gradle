plugins {
    id "eshg.java-lib"
}

configurations {
    xjc
}

dependencies {
    api project(':lib-commons')
    api project(':lib-procedures-api')
    api project(':lib-four-eyes-principle')
    api project(':lib-notification')
    api project(':lib-auditlog')

    implementation project(':lib-base-client')
    implementation project(':business-module-commons')
    implementation project(':business-module-persistence-commons')
    implementation project(':rest-oauth-client-commons')

    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.data:spring-data-jpa'
    implementation 'org.springframework:spring-aspects'
    implementation 'org.hibernate.validator:hibernate-validator'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.hibernate.orm:hibernate-core'
    implementation 'org.hibernate.orm:hibernate-envers'
    implementation 'de.cronn:reflection-util:latest.release'
    implementation 'org.apache.commons:commons-text:latest.release'

    implementation platform('org.apache.tika:tika-bom:latest.release')
    implementation 'org.apache.tika:tika-core'
    implementation 'org.apache.tika:tika-parser-pdf-module'
    implementation 'com.drewnoakes:metadata-extractor:latest.release'
    implementation 'org.eclipse.angus:jakarta.mail:latest.release'
    implementation 'org.verapdf:validation-model-jakarta:latest.release'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'

    implementation 'org.bouncycastle:bcpkix-jdk18on:latest.release'
    implementation 'org.bouncycastle:bcmail-jdk18on:latest.release'

    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen'

    testImplementation project(':rest-oauth-client-commons')
    testImplementation testFixtures(project(':business-module-persistence-commons'))
    testImplementation testFixtures(project(':base-api'))
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.instancio:instancio-core:latest.release'
    testImplementation 'org.apache.commons:commons-text:latest.release'
    testImplementation 'org.apache.commons:commons-collections4:latest.release'

    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'

    xjc 'org.glassfish.jaxb:jaxb-xjc:latest.release'
    xjc 'org.glassfish.jaxb:jaxb-runtime:latest.release'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-AaddSuppressWarningsAnnotation=true")
}

tasks.named("test").configure {
    dependsOn project(':base').tasks.named("composeUp")
    inputs.files(project(':base').tasks.named("bootJar")).withNormalizer(ClasspathNormalizer.class)
    inputs.files(project(':keycloak').tasks.named("jar")).withNormalizer(ClasspathNormalizer.class)
}

ext {
    catalogFile = "$projectDir/xdomea/catalog.xml"
    //find new version at https://www.xrepository.de/details/urn:xoev-de:xdomea:kosit:standard:xdomea
    zipFile = "$projectDir/xdomea/xdomea_3-1-0_XML-Schemata.zip"
    zipDir = layout.buildDirectory.dir("tmp/xdomea").get().asFile.path
    xsdFile = "$zipDir/xdomea_3-1-0_XML-Schemata/xdomea-Nachrichten-AussonderungDurchfuehren.xsd"
    xsdConfigFile = "$projectDir/xdomea/config.xsdconfig"
    generatedSources = layout.buildDirectory.dir("generated/sources/xdomea/java").get().asFile.path
}

sourceSets.main.java.srcDirs += generatedSources

tasks.register('unpackZip', Copy) {
    def outdir = file(zipDir)

    inputs.file file(zipFile)
    outputs.dir outdir

    for (File file : outdir.listFiles())
        if (!file.isDirectory())
            file.delete();

    from zipTree(zipFile)
    into outdir
}

tasks.register('xsd2java', JavaExec) {
    dependsOn unpackZip

    inputs.file file(catalogFile)
    inputs.dir file(zipDir)
    outputs.dir file(generatedSources)

    mainClass = "com.sun.tools.xjc.XJCFacade"
    classpath = configurations.xjc
    args "-d", generatedSources
    args "-p", "de.xdomea"
    args "-nv"
    args "-quiet"
    args "-catalog", catalogFile
    args xsdFile

    defaultCharacterEncoding = "UTF-8"
}

compileJava.dependsOn xsd2java
