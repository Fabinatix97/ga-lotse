      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    CreateInboxProcedureRequest:
      type: object
      properties:
        contactDetails:
          $ref: "#/components/schemas/ContactDetails"
        inboxProcedureType:
          $ref: "#/components/schemas/ProcedureType"
        inboxProgressEntry:
          $ref: "#/components/schemas/CreateInboxProgressEntry"
      required:
      - contactDetails
      - inboxProgressEntry
    CreateInboxProgressEntry:
      type: object
      properties:
        inboxProgressEntryType:
          $ref: "#/components/schemas/InboxProgressEntryType"
        messageText:
          type: string
        subject:
          type: string
      required:
      - inboxProgressEntryType
    CreateManualProgressEntryRequest:
      type: object
      properties:
        keyDocumentType:
          type: string
        manualProgressEntryType:
          $ref: "#/components/schemas/ManualProgressEntryType"
        messageText:
          type: string
        note:
          type: string
        subject:
          type: string
      required:
      - manualProgressEntryType
    DataOrigin:
      type: string
      description: "A list of possible origins of Persons and Facility in the Central\
        \ Files. EDIT will only be set automatically on changes. EXTERNAL is for entries\
        \ that come, e.g., from the citizen portal. IMPORT is reserved for automatic\
        \ imports. MANUAL shall be set for every creation or connection done by an\
        \ employee."
      enum:
      - MANUAL
      - EXTERNAL
      - IMPORT
      - EDIT
    Decision:
      type: string
      enum:
      - GRANTED
      - DENIED
    DefaultPopulationResponse:
      type: object
      properties:
        populations:
          type: array
          items:
            $ref: "#/components/schemas/Population"
    DetailedFacility:
      type: object
      properties:
        facilityFileState:
          $ref: "#/components/schemas/FacilityFileState"
        facilityType:
          $ref: "#/components/schemas/FacilityType"
      required:
      - facilityFileState
      - facilityType
    DetailedPerson:
      type: object
      properties:
        person:
          $ref: "#/components/schemas/PersonFileState"
        personType:
          $ref: "#/components/schemas/PersonType"
      required:
      - person
      - personType
    DetailedTask:
      type: object
      properties:
        assignedByName:
          type: string
        assigneeName:
          type: string
        task:
          $ref: "#/components/schemas/Task"
      required:
      - task
    DomesticAddress:
      type: object
      allOf:
      - $ref: "#/components/schemas/Address"
      - type: object
        properties:
          addressAddition:
            type: string
            description: A descriptive addition to the address.
            example: 2.OG links
            maxLength: 100
            minLength: 1
          city:
            type: string
            description: The city in which the address is located.
            example: Berlin
            maxLength: 50
            minLength: 1
          country:
            $ref: "#/components/schemas/CountryCode"
          differentName:
            type: string
            description: "If the name of the addressee deviates from the present name\
              \ of a Person or Facility, e.g. when a company pays the bill for its\
              \ employee or a parent company shall be contacted instead of its subsidiary."
            example: Parent Company AG
            maxLength: 200
            minLength: 1
          houseNumber:
            type: string
            description: "The house number of the address, including extensions."
            example: 1a
            maxLength: 11
            minLength: 1
          postalCode:
            type: string
            description: The postal code of the address.
            example: "10115"
            maxLength: 20
            minLength: 1
          street:
            type: string
            description: "The name of the street of the address, without the house\
              \ number."
            example: Beispielweg
            maxLength: 55
            minLength: 1
      description: A usual domestic address.
      required:
      - city
      - country
      - postalCode
      - street
    ExportArchivingRelevantProceduresRequest:
      type: object
      properties:
        procedures:
          type: array
          items:
