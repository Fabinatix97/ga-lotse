openapi: 3.0.1
info:
  description: This is a the generic API for all business modules
  title: The generic procedure library API for business modules
  version: "0.1"
servers:
- url: http://localhost:8080
paths:
  /approval-requests/{approvalRequestId}:
    get:
      operationId: getApprovalRequest
      parameters:
      - in: path
        name: approvalRequestId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: OK
      tags:
      - ApprovalRequest
  /approval-requests/{approvalRequestId}/decision:
    put:
      operationId: decideApprovalRequest
      parameters:
      - in: path
        name: approvalRequestId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - ApprovalRequest
  /archiving/config:
    get:
      operationId: getArchivingConfiguration
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetArchivingConfigurationResponse"
          description: OK
      summary: Get archiving configuration
      tags:
      - Archiving
  /archiving/procedures:
    get:
      operationId: getArchivableProcedures
      parameters:
      - description: |
          Filter logic:
          - If `procedureType` is submitted, only procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place
        in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `closedAtDay` is set, only procedures are returned which were closed at that date
          - If not submitted, no filtering takes place
        in: query
        name: closedAtDay
        required: false
        schema:
          type: string
          format: date
      - description: |
          Filter logic:
          - If `defaultArchivingRelevance` is submitted, only procedures are returned which have one of the submitted default archiving relevances.
          - If not submitted, no filtering takes place
        in: query
        name: defaultArchivingRelevance
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ArchivingRelevance"
          uniqueItems: true
      - description: |
          The following sorting options are available:
          - `CLOSED_AT`: Sorting by closedAt attribute
          - `PROCEDURE_TYPE`: Sorting by procedureType attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetArchivableProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetArchivableProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetArchivableProceduresResponse"
          description: OK
      summary: Get archivable procedures
      tags:
      - Archiving
  /archiving/procedures/bulk-update-archiving-relevance:
    post:
      operationId: bulkUpdateProceduresArchivingRelevance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateProceduresArchivingRelevanceRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkUpdateProceduresArchivingRelevanceResponse"
          description: OK
      summary: Bulk update procedures archiving relevance
      tags:
      - Archiving
  /archiving/relevant-procedures:
    get:
      operationId: getRelevantArchivableProcedures
      parameters:
      - description: |
          Filter logic:
          - If `closedAtDay` is set, only procedures are returned which were closed at that date
          - If not submitted, no filtering takes place
        in: query
        name: closedAtDay
        required: false
        schema:
          type: string
          format: date
      - description: |
          Filter logic:
          - If `exported` is true, only procedures are returned which have already been exported.
          - If `exported` is false, only procedures are returned which have not been exported, yet.
          - If not submitted, no filtering takes place
        in: query
        name: exported
        required: false
        schema:
          type: boolean
      - description: |
          The following sorting options are available:
          - `CLOSED_AT`: Sorting by closedAt attribute
          - `EXPORTED_AT`: Sorting by exportedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetRelevantArchivableProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetRelevantArchivableProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRelevantArchivableProceduresResponse"
          description: OK
      summary: Get relevant archivable procedures
      tags:
      - Archiving
  /archiving/relevant-procedures/export:
    post:
      operationId: exportRelevantProcedures
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportArchivingRelevantProceduresRequest"
        required: true
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: OK
      tags:
      - Archiving
  /files/{fileId}:
    delete:
      operationId: deleteFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Soft deletes the specified file
      tags:
      - File
    get:
      operationId: getFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/Image"
                - $ref: "#/components/schemas/Mail"
                - $ref: "#/components/schemas/Pdf"
          description: OK
      summary: Retrieves the meta data of the specified file
      tags:
      - File
  /files/{fileId}/deletion-request:
    post:
      operationId: requestFileDeletion
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequestRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: OK
      summary: Request deletion of a file entry
      tags:
      - File
  /files/{fileId}/download:
    get:
      operationId: downloadFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: OK
      tags:
      - File
  /files/{fileId}/meta-data:
    put:
      operationId: updateFileMetaData
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/ImageMetaData"
              - $ref: "#/components/schemas/MailMetaData"
              - $ref: "#/components/schemas/PdfMetaData"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/Image"
                - $ref: "#/components/schemas/Mail"
                - $ref: "#/components/schemas/Pdf"
          description: Updated file
      summary: Updates the meta data of the specified file
      tags:
      - File
  /files/{fileId}/meta-data/history:
    get:
      operationId: getMetaDataHistory
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetMetaDataHistoryResponse"
          description: OK
      tags:
      - File
  /inbox-procedures:
    get:
      description: |
        Get all inbox procedures with filter, sort, and pagination options
      operationId: getInboxProcedures
      parameters:
      - description: |
          Filter logic:
          - If `inboxProcedureType` is submitted, only inbox procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place.
        in: query
        name: inboxProcedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If true, inbox procedures which have no type are returned in addition to the types specified by 'inboxProcedureType'.
          - If false or not submitted, inbox procedures which have no type are not returned.
        in: query
        name: includeUntyped
        required: false
        schema:
          type: boolean
      - description: |
          Filter logic:
          - If `inboxProcedureStatus` is submitted, only inbox procedures are returned which have one of the submitted statuses.
          - If not submitted, no filtering takes place.
        in: query
        name: inboxProcedureStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/InboxProcedureStatus"
          uniqueItems: true
      - description: |
          The following sorting options are available:
          - `CREATED_AT`: Sorting by createdAt attribute
          - `MODIFIED_AT`: Sorting by modifiedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetInboxProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetInboxProceduresSortOrder"
      - description: Number of the requested page
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: Amount of requested inbox procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 25
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetInboxProceduresResponse"
          description: OK
      summary: Get inbox procedures
      tags:
      - InboxProcedure
    post:
      description: |-
        Creates an inbox procedure with an optional file upload.

               Permitted file formats:
                - Image formats: jpeg, png
                - PDF formats: pdf/a
                - Mail formats: eml
      operationId: addInboxProcedure
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                createInboxProcedureRequest:
                  $ref: "#/components/schemas/CreateInboxProcedureRequest"
                file:
                  type: string
                  format: binary
                fileMetaData:
                  $ref: "#/components/schemas/FileMetaData"
              required:
              - createInboxProcedureRequest
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InboxProcedure"
          description: OK
      summary: Add inbox procedure
      tags:
      - InboxProcedure
  /inbox-procedures/{inboxProcedureId}:
    get:
      operationId: getInboxProcedure
      parameters:
      - in: path
        name: inboxProcedureId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetInboxProcedureResponse"
          description: OK
      summary: Get inbox procedure with detailed information
      tags:
      - InboxProcedure
  /inbox-procedures/{inboxProcedureId}/inbox-procedure-status:
    put:
      operationId: updateInboxProcedureStatus
      parameters:
      - in: path
        name: inboxProcedureId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxProcedureStatus"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InboxProcedure"
          description: OK
      summary: Update status of inbox procedure
      tags:
      - InboxProcedure
  /procedure-metrics:
    get:
      operationId: getProcedureMetrics
      parameters:
      - in: query
        name: timeRangeStart
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: timeRangeEnd
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProcedureMetricsResponse"
          description: the metrics of procedures
      summary: Get procedure metrics for procedures created in the given time range
      tags:
      - Procedure
  /procedures:
    get:
      description: |
        GET operation for retrieving basic information of procedures for the procedure overview.
      operationId: getProcedures
      parameters:
      - description: |
          Only procedures are returned where the assigneeId of at least one task equals the `assignedToId`.
          If not submitted, no filtering takes place.
        in: query
        name: assignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Only procedures are returned where the assigneeId of none of the task equals `notAssignedToId`.
          If not submitted, no filtering takes place.
        in: query
        name: notAssignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Only procedures are returned where the user is or was assigned to at least one task (at least one assigneeId equals `onceAssignedToId` in taskHistory for at least one task).
          If not submitted, no filtering takes place.
        in: query
        name: onceAssignedToId
        required: false
        schema:
          type: string
          format: uuid
      - description: |
          Filter logic:
          - In case of `true` only procedures are returned where all tasks are unassigned
          - In case of `false` only procedures are returned which have at least one assigned task
          - If not submitted, no filtering takes place
        in: query
        name: unassigned
        required: false
        schema:
          type: boolean
      - description: |
          Filter logic:
          - If `procedureType` is submitted, only procedures are returned which have one of the submitted types.
          - If not submitted, no filtering takes place
        in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `procedureStatus` is submitted, only procedures are returned which have one of the submitted statuses.
          - If not submitted, no filtering takes place
        in: query
        name: procedureStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureStatus"
          uniqueItems: true
      - description: |
          Filter logic:
          - If `createdInYear` is set, only procedures are returned which were created in that year
          - If not submitted, no filtering takes place
        in: query
        name: createdInYear
        required: false
        schema:
          type: string
      - description: |
          The following sorting options are available:
          - `CREATED_AT`: Sorting by createdAt attribute
          - `MODIFIED_AT`: Sorting by modifiedAt attribute
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/GetProceduresSortBy"
      - description: Sorting order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetProceduresSortOrder"
      - description: Limit of returned procedures
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Offset used for pagination
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2000
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProceduresResponse"
          description: the users recent procedures
      summary: Get recent procedures for user
      tags:
      - Procedure
  /procedures/recent:
    get:
      operationId: getRecentProcedures
      parameters:
      - in: query
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - in: query
        name: procedureStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureStatus"
          uniqueItems: true
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRecentProceduresResponse"
          description: the users recent procedures
      summary: Get recent procedures for user
      tags:
      - Procedure
  /procedures/recent/self:
    get:
      operationId: getSelfRecentProcedures
      parameters:
      - in: query
        name: procedureType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureType"
          uniqueItems: true
      - in: query
        name: procedureStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureStatus"
          uniqueItems: true
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRecentProceduresResponse"
          description: the current users recent procedures
      summary: Get recent procedures for the current user
      tags:
      - Procedure
  /procedures/search:
    get:
      operationId: searchProcedures
      parameters:
      - in: query
        name: query
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProceduresResponse"
          description: OK
      tags:
      - Procedure
  /procedures/searchByPerson:
    get:
      operationId: searchProceduresByPerson
      parameters:
      - in: query
        name: firstName
        required: true
        schema:
          type: string
      - in: query
        name: lastName
        required: true
        schema:
          type: string
      - in: query
        name: dateOfBirth
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TestGetProcedureByPersonResponse"
          description: OK
      tags:
      - Procedure
  /procedures/{id}:
    get:
      operationId: getDetailedProcedure
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetDetailedProcedureResponse"
          description: a single procedure with details
      summary: Get a single procedure with details
      tags:
      - Procedure
  /procedures/{id}/approval-requests:
    get:
      operationId: getApprovalRequests
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProcedureApprovalRequestsResponse"
          description: OK
      summary: Get all approval requests related to this procedure
      tags:
      - Procedure
  /procedures/{id}/files:
    get:
      operationId: getProcedureFileDetails
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProcedureFileDetailsResponse"
          description: OK
      summary: Get all file details for a procedure
      tags:
      - Procedure
  /procedures/{procedureId}/progress-entries:
    get:
      operationId: getProgressEntries
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      - description: Filter on progressEntryType
        in: query
        name: progressEntryType
        required: false
        schema:
          type: array
          items:
            type: string
          uniqueItems: true
      - description: Filter on child class of progressEntry
        in: query
        name: progressEntryClass
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProgressEntryClass"
          uniqueItems: true
      - description: |
          If `initiatedBy` is set with a `userId` then the following is returned:
          * Only progressEntries with `createdBy`=`userId` in case `ManualProgressEntry` or `ProcessedInboxProgressEntry`
          * Only progressEntries with `triggeredBy`=`userId` in case `SystemProgressEntry`
        in: query
        name: initiatedBy
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
      - description: |
          Filter on triggerType.
          If this is set, only SystemProgressEntries are returned since only SystemProgressEntries have this attribute.
        in: query
        name: triggerType
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/TriggerType"
          uniqueItems: true
      - description: 'Sorting on either modifiedAt or createdAt '
        in: query
        name: sortBy
        required: false
        schema:
          $ref: "#/components/schemas/ProgressEntrySortBy"
      - description: Sorting order. Possible options  "ASC" for ascending and "DESC"
          for descending.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/ProgressEntrySortOrder"
      - description: Maximum number of elements to return
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - description: Index of page to be returned
        in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProgressEntriesResponse"
          description: OK
      summary: Get list of procedure's progress entries
      tags:
      - ProgressEntry
    post:
      description: |-
        Creates a manual progress entry with an optional file upload.

               Permitted file formats:
                - Image formats: jpeg, png
                - PDF formats: pdf/a
                - Mail formats: eml
      operationId: addProgressEntry
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                createManualProgressEntryRequest:
                  $ref: "#/components/schemas/CreateManualProgressEntryRequest"
                file:
                  type: string
                  format: binary
                fileMetaData:
                  $ref: "#/components/schemas/FileMetaData"
              required:
              - createManualProgressEntryRequest
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ManualProgressEntry"
          description: OK
      summary: Create a manual progress entry
      tags:
      - ProgressEntry
  /procedures/{procedureId}/progress-entries/{progressEntryId}:
    delete:
      operationId: removeProgressEntry
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: progressEntryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Remove a manual progress entry
      tags:
      - ProgressEntry
    get:
      operationId: getProgressEntry
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: progressEntryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetProgressEntryResponse"
          description: OK
      summary: Get a progress entry
      tags:
      - ProgressEntry
    patch:
      operationId: patchProgressEntry
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: progressEntryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchManualProgressEntryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ManualProgressEntry"
          description: OK
      summary: Modify a manual progress entry
      tags:
      - ProgressEntry
  /procedures/{procedureId}/progress-entries/{progressEntryId}/deletion-request:
    post:
      operationId: requestProgressEntryDeletion
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: progressEntryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequestRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: OK
      summary: Request deletion of a manual progress entry
      tags:
      - ProgressEntry
  /procedures/{procedureId}/progress-entries/{progressEntryId}/history:
    get:
      operationId: getManualProgressEntryHistory
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: progressEntryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetManualProgressEntryHistoryResponse"
          description: OK
      summary: Get the history of a manual progress entry
      tags:
      - ProgressEntry
  /task-metrics:
    get:
      operationId: getTaskMetrics
      parameters:
      - in: query
        name: procedureType
        required: true
        schema:
          $ref: "#/components/schemas/ProcedureType"
      - in: query
        name: timeRangeStart
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: timeRangeEnd
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetTaskMetricsResponse"
          description: the metrics of a specific procedure type
      summary: Get tasks metrics for a procedure type of a business module for procedures
        created in the given time range
      tags:
      - Task
  /tasks:
    get:
      operationId: getTasks
      parameters:
      - in: query
        name: assigneeId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: assignedById
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
      - in: query
        name: taskTypes
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/TaskType"
          uniqueItems: true
      - in: query
        name: taskStatus
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatus"
          uniqueItems: true
      - in: query
        name: hasDueAt
        required: false
        schema:
          type: boolean
      - in: query
        name: isOverdue
        required: false
        schema:
          type: boolean
      - in: query
        name: wasAssignedByOther
        required: false
        schema:
          type: boolean
      - in: query
        name: sortKey
        required: true
        schema:
          $ref: "#/components/schemas/GetTasksSortBy"
      - in: query
        name: sortOrder
        required: false
        schema:
          $ref: "#/components/schemas/GetTasksSortOrder"
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: tasks
      summary: Get tasks
      tags:
      - Task
  /tasks/dashboard:
    get:
      operationId: getTasksForDashboard
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: tasks
      summary: Get tasks for the dashboard
      tags:
      - Task
  /tasks/team-view:
    get:
