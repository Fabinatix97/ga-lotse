components:
  schemas:
    AbstractFile:
      type: object
      allOf:
      - $ref: "#/components/schemas/AbstractFileReference"
      - type: object
        properties:
          attachedToMail:
            type: string
            format: uuid
          createdAt:
            type: string
            format: date-time
          createdBy:
            type: string
            format: uuid
          fileName:
            type: string
          fileSizeBytes:
            type: integer
            format: int32
          fileType:
            $ref: "#/components/schemas/FileType"
          locked:
            type: boolean
          modifiedAt:
            type: string
            format: date-time
      - type: object
        properties:
          '@type':
            type: string
      discriminator:
        propertyName: '@type'
      required:
      - '@type'
      - createdAt
      - createdBy
      - deletable
      - deleted
      - fileId
      - fileName
      - fileSizeBytes
      - fileType
      - locked
      - modifiedAt
    AbstractFileReference:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
        deletable:
          type: boolean
        deleted:
          type: boolean
        fileId:
          type: string
          format: uuid
      required:
      - '@type'
      - deletable
      - deleted
      - fileId
    AddBarrierTestHelperResponse:
      type: object
      properties:
        barrierId:
          type: integer
          format: int64
          minimum: 1
      required:
      - barrierId
    Address:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
      required:
      - '@type'
    ApprovalRequest:
      type: object
      properties:
        approvalRequestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          format: uuid
        decision:
          $ref: "#/components/schemas/Decision"
        entity:
          oneOf:
          - $ref: "#/components/schemas/ManualProgressEntry"
          - $ref: "#/components/schemas/Image"
          - $ref: "#/components/schemas/Mail"
          - $ref: "#/components/schemas/Pdf"
        operation:
          $ref: "#/components/schemas/Operation"
        reason:
          type: string
        status:
          $ref: "#/components/schemas/ApprovalRequestStatus"
      required:
      - approvalRequestId
      - createdAt
      - createdBy
      - operation
      - reason
      - status
    ApprovalRequestEntity:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
      required:
      - '@type'
    ApprovalRequestStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
    ArchivingDetails:
      type: object
      properties:
        archivingPeriodYears:
          type: integer
          format: int32
        archivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
      required:
      - archivingPeriodYears
      - archivingRelevance
    ArchivingRelevance:
      type: string
      enum:
      - DEFAULT
      - RELEVANT
      - IRRELEVANT
    ArchivingRelevanceSettings:
      type: object
      properties:
        archivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
        defaultArchivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
      required:
      - archivingRelevance
      - defaultArchivingRelevance
    AssignTaskRequest:
      type: object
      properties:
        assignee:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        taskVersion:
          type: integer
          format: int64
      required:
      - assignee
      - taskVersion
    BulkUpdateProceduresArchivingRelevanceRequest:
      type: object
      properties:
        archivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
        procedures:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 1
          uniqueItems: true
      required:
      - archivingRelevance
      - procedures
    BulkUpdateProceduresArchivingRelevanceResponse:
      type: object
      properties:
        archivingRelevance:
          $ref: "#/components/schemas/ArchivingRelevance"
        failedProcedures:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        updatedProcedures:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
      required:
      - archivingRelevance
      - failedProcedures
      - updatedProcedures
    BusinessModule:
      type: string
      enum:
      - INSPECTION
      - SCHOOL_ENTRY
      - TRAVEL_MEDICINE
      - MEASLES_PROTECTION
      - STI_PROTECTION
      - MEDICAL_REGISTRY
    ConcreteFileDto:
      type: object
      allOf:
      - $ref: "#/components/schemas/AbstractFile"
      - type: object
        properties:
