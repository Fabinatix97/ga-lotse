          format: uuid
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          format: uuid
        decision:
          $ref: "#/components/schemas/Decision"
