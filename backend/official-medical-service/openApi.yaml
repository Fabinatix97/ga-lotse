components:
  schemas:
    AbstractFile:
      type: object
      allOf:
      - $ref: "#/components/schemas/AbstractFileReference"
      - type: object
        properties:
          '@type':
            type: string
          createdAt:
            type: string
            format: date-time
          createdBy:
            type: string
            format: uuid
          fileName:
            type: string
          fileSizeBytes:
            type: integer
            format: int32
          fileType:
            $ref: "#/components/schemas/FileType"
          locked:
            type: boolean
          modifiedAt:
            type: string
            format: date-time
      - $ref: "#/components/schemas/ApprovalRequestEntity"
      discriminator:
        propertyName: '@type'
      required:
      - '@type'
      - createdAt
      - deletable
      - deleted
      - fileId
      - fileName
      - fileSizeBytes
      - fileType
      - locked
      - modifiedAt
    AbstractFileReference:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
        deletable:
          type: boolean
        deleted:
          type: boolean
        fileId:
          type: string
          format: uuid
      required:
      - '@type'
      - deletable
      - deleted
      - fileId
    AddBarrierTestHelperResponse:
      type: object
      properties:
        barrierId:
          type: integer
          format: int64
          minimum: 1
      required:
      - barrierId
    AddGdprValidationTaskRequest:
      type: object
      properties:
        gdprProcedureId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        type:
          $ref: "#/components/schemas/GdprProcedureType"
      required:
      - gdprProcedureId
      - startedAt
      - type
    Address:
      type: object
      discriminator:
        propertyName: '@type'
      properties:
        '@type':
          type: string
      required:
      - '@type'
    AffectedPerson:
      type: object
      properties:
        affectedPersonSync:
          $ref: "#/components/schemas/AffectedPersonSync"
        contactAddress:
          oneOf:
          - $ref: "#/components/schemas/DomesticAddress"
          - $ref: "#/components/schemas/PostboxAddress"
        countryOfBirth:
          $ref: "#/components/schemas/CountryCode"
        dateOfBirth:
          type: string
          format: date
        emailAddresses:
          type: array
          items:
            type: string
        firstName:
          type: string
          maxLength: 80
          minLength: 0
        gender:
          $ref: "#/components/schemas/Gender"
        lastName:
          type: string
          maxLength: 120
          minLength: 0
        nameAtBirth:
          type: string
          maxLength: 40
          minLength: 1
        phoneNumbers:
          type: array
          items:
            type: string
            maxLength: 23
            minLength: 1
        placeOfBirth:
          type: string
          maxLength: 50
          minLength: 1
        salutation:
          $ref: "#/components/schemas/Salutation"
        title:
          type: string
          maxLength: 119
          minLength: 1
        version:
          type: integer
          format: int64
      required:
      - contactAddress
      - dateOfBirth
      - firstName
      - lastName
      - version
    AffectedPersonSync:
      type: object
      properties:
        fileStateId:
          type: string
          format: uuid
        outdated:
          type: boolean
        version:
          type: integer
          format: int64
      required:
      - fileStateId
      - outdated
      - version
    Appointment:
      type: object
      description: Appointment of a procedure.
      properties:
        end:
          type: string
          format: date-time
        start:
          type: string
          format: date-time
      required:
      - end
      - start
    AppointmentBlockSortKey:
      type: string
      enum:
      - START
      - END
