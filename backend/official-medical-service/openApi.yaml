        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncFacilityRequest"
        required: true
      responses:
        "200":
          description: OK
      summary: Synchronize facility data
      tags:
      - EmployeeOmsProcedure
  /employee/procedures/{procedureId}/affected-person:
    patch:
      operationId: updateAffectedPerson
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAffectedPersonRequest"
        required: true
      responses:
        "200":
          description: OK
      summary: Update affected person in an oms procedure
      tags:
      - EmployeeOmsProcedure
  /employee/procedures/{procedureId}/sync-affected-person:
    put:
      operationId: syncAffectedPerson
      parameters:
      - in: path
        name: procedureId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAffectedPersonRequest"
        required: true
      responses:
        "200":
          description: OK
      summary: Synchronize affected person data
      tags:
      - EmployeeOmsProcedure
  /files/{fileId}:
    delete:
      operationId: deleteFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Soft deletes the specified file
      tags:
      - File
    get:
      operationId: getFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/Image"
                - $ref: "#/components/schemas/Mail"
                - $ref: "#/components/schemas/Pdf"
          description: OK
      summary: Retrieves the meta data of the specified file
      tags:
      - File
  /files/{fileId}/deletion-request:
    post:
      operationId: requestFileDeletion
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequestRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: OK
      summary: Request deletion of a file entry
      tags:
      - File
  /files/{fileId}/download:
    get:
      operationId: downloadFile
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: OK
      tags:
      - File
  /files/{fileId}/meta-data:
    put:
      operationId: updateFileMetaData
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/ImageMetaData"
              - $ref: "#/components/schemas/MailMetaData"
              - $ref: "#/components/schemas/PdfMetaData"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/Image"
                - $ref: "#/components/schemas/Mail"
                - $ref: "#/components/schemas/Pdf"
          description: Updated file
      summary: Updates the meta data of the specified file
      tags:
      - File
  /files/{fileId}/meta-data/history:
    get:
      operationId: getMetaDataHistory
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetMetaDataHistoryResponse"
          description: OK
      tags:
      - File
  /gdpr-validation-tasks:
    get:
      operationId: getAllGdprValidationTasks
      parameters:
      - in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/GdprValidationTaskStatus"
      - in: query
        name: sortKey
        required: false
        schema:
          $ref: "#/components/schemas/GdprValidationTaskSortKey"
      - in: query
        name: sortDirection
        required: false
        schema:
          $ref: "#/components/schemas/SortDirection"
      - in: query
        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetAllValidationTasksResponse"
          description: OK
      summary: Get all GDPR validation tasks
      tags:
      - GdprValidationTask
    post:
      operationId: addGdprValidationTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGdprValidationTaskRequest"
        required: true
      responses:
        "200":
          description: Add a GDPR validation task
      summary: Add a GDPR validation task
      tags:
      - GdprValidationTask
  /gdpr-validation-tasks/notification-banner:
    get:
      operationId: getGdprNotificationBanner
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetGdprNotificationBannerResponse"
          description: OK
      summary: Get data for GDPR notification banner
      tags:
      - GdprValidationTask
  /gdpr-validation-tasks/{gdprProcedureId}:
    delete:
      operationId: deleteGdprValidationTaskAndDownloadPackages
      parameters:
      - in: path
        name: gdprProcedureId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteDownloadPackagesRequest"
        required: true
      responses:
        "200":
          description: OK
      summary: Delete the GDPR validation task with gdprProcedureId and GDPR download
        packages with ids from request
      tags:
      - GdprValidationTask
    get:
      operationId: getGdprValidationTask
      parameters:
      - in: path
        name: gdprProcedureId
        required: true
        schema:
          type: string
          format: uuid
