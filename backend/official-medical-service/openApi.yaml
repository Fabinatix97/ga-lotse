      type: string
      enum:
      - CONSULTATION
      - VACCINATION
      - REGULAR_EXAMINATION
      - CAN_CHILD
      - ENTRY_LEVEL
      - SPECIAL_NEEDS
      - PROOF_SUBMISSION
      - HIV_STI_CONSULTATION
      - SEX_WORK
      - RESULTS_REVIEW
      - OFFICIAL_MEDICAL_SERVICE
