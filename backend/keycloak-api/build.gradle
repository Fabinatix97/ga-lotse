plugins {
    id "eshg.java-lib"
}

dependencies {
    api 'org.apache.cxf:cxf-rt-rs-client:latest.release'
    api 'io.swagger.core.v3:swagger-annotations:latest.release'
    api 'io.swagger:swagger-annotations:latest.release'
    api 'com.fasterxml.jackson.core:jackson-annotations'

    api 'org.springframework:spring-web'
    api 'org.springframework:spring-context'

    api 'io.swagger.core.v3:swagger-annotations-jakarta:latest.release'
    implementation 'jakarta.validation:jakarta.validation-api'
}
