plugins {
    id 'eshg.java-lib'
    id 'java-test-fixtures'
}

dependencies {
    api project(':lib-commons')
    api project(':test-helper-commons-api')
    api 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation project(':test-helper-commons-spring')

    testFixturesImplementation project(':test-commons')
    testFixturesImplementation project(':test-helper-commons-spring')
    testFixturesImplementation 'org.testcontainers:postgresql'
    testFixturesApi 'org.testcontainers:testcontainers'
    testFixturesApi 'org.springframework:spring-test'
}
