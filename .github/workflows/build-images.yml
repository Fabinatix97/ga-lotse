name: build-images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  TZ: Europe/Berlin

jobs:
  prepare:
    name: Prepare Docker contexts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      images: ${{ steps.list.outputs.images }}
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Image coordinates
        id: meta
        run: |
          prefix="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=dev" >> "${GITHUB_OUTPUT}"
          else
            branch="$(echo '${{ github.ref_name }}' | tr '/_' '-' | tr '[:upper:]' '[:lower:]')"
            echo "tag=${branch}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare Docker contexts
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          ./gradlew --no-daemon prepareDockerContext \
            -x test -x check -x lint -x formatCheck \
            -x composeUp -x composeBuild
          bash ci/collect-docker-contexts.sh

      - name: List images
        id: list
        run: |
          images="$(find docker-contexts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "Images: ${images}"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-contexts
          path: docker-contexts
          include-hidden-files: true
          retention-days: 1
          compression-level: 6

  build:
    name: ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-contexts
          path: docker-contexts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Docker build-args
        id: buildargs
        run: |
          file="docker-contexts/${{ matrix.image }}/build-args.env"
          if [[ -f "${file}" ]]; then
            {
              echo "args<<EOF"
              cat "${file}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: docker-contexts/${{ matrix.image }}
          push: true
          provenance: false
          build-args: ${{ steps.buildargs.outputs.args }}
          tags: |
            ${{ needs.prepare.outputs.prefix }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.prefix }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
