
server {
    listen       4001;
    server_name  reverse-proxy;

    #access_log  /var/log/nginx/host.access.log  main;

    location = /auth/keycloak {
        include forward_headers.conf;
        proxy_pass http://host.docker.internal:8093/auth/keycloak;
    }

    location = /auth/login/keycloak {
        include forward_headers.conf;
        proxy_pass http://host.docker.internal:8093/auth/login/keycloak;
    }

    location = /logout/keycloak {
        proxy_pass http://host.docker.internal:8093/logout/keycloak;
    }

    location = /logout {
        include forward_headers.conf;
        proxy_pass http://host.docker.internal:8093/logout;
    }

    location = /browser-aktualisieren {
        proxy_pass http://host.docker.internal:8093/browser_update_required.html;
    }

    location = /login-error {
        proxy_pass http://host.docker.internal:8093/login_error.html;
    }

    # No authorization required for the Department API
    location /api/base/department/ {
        proxy_pass http://host.docker.internal:8080/department/;
    }

    # No authorization required for the Config API
    location = /api/base/public/config {
        proxy_pass http://host.docker.internal:8080/public/config;
    }

    location /api/base/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8080/;
    }

    location /api/inspection/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8081/gdpr-validation-tasks/;
    }

    # No authorization required for public citizen api
    location /api/school-entry/citizen/public/ {
        proxy_pass http://host.docker.internal:8082/citizen/public/;
    }

    location /api/school-entry/citizen/auth/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8082/citizen/auth/;
    }

    location /api/school-entry/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8082/gdpr-validation-tasks/;
    }

    # No authorization required for the MeaslesProtectionAPI
    location /api/measles-protection/organisations/ {
        proxy_pass http://host.docker.internal:8086/organisations/;
    }

    location /api/measles-protection/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8086/gdpr-validation-tasks/;
    }

    # No authorization required for the CitizenPublicController
    location /api/travel-medicine/citizen/public/ {
        proxy_pass http://host.docker.internal:8085/citizen/public/;
    }

    location /api/travel-medicine/citizen/auth/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8085/citizen/auth/;
    }

    location /api/travel-medicine/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8085/gdpr-validation-tasks/;
    }

    location /api/sti-protection/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8095/gdpr-validation-tasks/;
    }

    # No authorization required for public api
    location /api/medical-registry/medical-registry-entries/public {
        proxy_pass http://host.docker.internal:8097/medical-registry-entries/public;
    }

    location /api/medical-registry/public {
        proxy_pass http://host.docker.internal:8097/public;
    }

    location /api/medical-registry/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8097/gdpr-validation-tasks/;
    }

    # No authorization required for public api
    location /api/opendata/citizen/public {
        proxy_pass http://host.docker.internal:8096/citizen/public;
    }

    location /api/dental/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8098/gdpr-validation-tasks/;
    }

    # No authorization required for the CitizenPublicController
    location /api/official-medical-service/citizen-public/ {
        proxy_pass http://host.docker.internal:8099/citizen-public/;
    }

    location /api/official-medical-service/citizen-auth/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8099/citizen-auth/;
    }

    location /api/official-medical-service/gdpr-validation-tasks/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8099/gdpr-validation-tasks/;
    }

    # No authorization required for the base feature toggles endpoint
    location = /api/base/feature-toggles {
        proxy_pass http://host.docker.internal:8080/feature-toggles;
    }

    # No authorization required for the travel medicine feature toggles endpoint
    location = /api/travel-medicine/feature-toggles {
        proxy_pass http://host.docker.internal:8085/feature-toggles;
    }

    # No authorization required for the medical registry feature toggles endpoint
    location = /api/medical-registry/feature-toggles {
        proxy_pass http://host.docker.internal:8097/feature-toggles;
    }

    # No authorization required for the medical registry feature toggles endpoint
    location = /api/opendata/feature-toggles {
        proxy_pass http://host.docker.internal:8096/feature-toggles;
    }

    # No authorization required for the sti protection public endpoints
    location /api/sti-protection/citizen/public {
        proxy_pass http://host.docker.internal:8095/citizen/public;
    }

    location /api/sti-protection/citizen/auth/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8095/citizen/auth/;
    }

    # handle disabled backends as 404
    # note: all /api/ routes must appear before this
    location /api/ {
      return 404;
    }

    # Needed to support hot-reloading of the local Next.js dev server
    # see https://nextjs.org/docs/pages/building-your-application/upgrading/version-12#hmr-connection-now-uses-a-websocket
    location /_next/webpack-hmr {
        proxy_pass http://host.docker.internal:3001/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # See https://cronn-gmbh.atlassian.net/browse/ISSUE-3660
    location = /esu {
        return 301 /einschulungsuntersuchung$is_args$args;
    }

    location = /sti {
      return 301 /sexuelle-gesundheit/sti-beratung$is_args$args;
    }

    location = /sab {
      return 301 /sexuelle-gesundheit/sexarbeit$is_args$args;
    }

    # No authentication needed for security.txt
    location = /.well-known/security.txt {
        proxy_pass http://host.docker.internal:8080/department/security-txt;
    }
    location = /pgp-key.txt {
        proxy_pass http://host.docker.internal:8080/department/security-txt-public-key;
    }

    # No authentication for static stuff
    location /_next/static/ {
        proxy_pass http://host.docker.internal:3001;
    }

    location ~ ^/((en|de)/)?(einschulungsuntersuchung/.+|(?:unternehmen/)?mein-bereich/.+|impfberatung/meine-termine(?:/.+)?|sexuelle-gesundheit/mein-bereich|amtsaerztlicherdienst/mein-bereich(?:/.+)?)$ {
        include auth_request.conf;

        auth_request_set $resolved_location $upstream_http_location;
        auth_request_set $auth_cookie $upstream_http_set_cookie;

        error_page 401 = @handle_redirect;

        proxy_pass http://host.docker.internal:3001;
    }

    location / {
        # Default authentication requirement dropped until integration with MyUnternehmensKonto is complete
        # include auth_request.conf;

        # auth_request_set $resolved_location $upstream_http_location;
        # auth_request_set $auth_cookie $upstream_http_set_cookie;

        # error_page 401 = @handle_redirect;

        proxy_pass http://host.docker.internal:3001;
    }

    location @handle_redirect {
        add_header Set-Cookie $auth_cookie;

        return 302 $resolved_location;
    }

    location = /auth {
        internal;

        include forward_headers.conf;

        proxy_pass http://host.docker.internal:8093/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI     $request_uri;
        proxy_set_header X-Original-Method  $request_method;
        proxy_set_header X-Correlation-ID   $request_id;

        proxy_intercept_errors on;
        error_page 302 = @rewrite_302_to_401;
    }

    # Deny access to hidden files.
    location ~/\.{
        deny all;
    }

    # Unfortunately, Nginx does not allow to return a 302 in an auth_request.
    # So we workaround by temporarily rewriting it to 401
    location @rewrite_302_to_401 {
      return 401;
    }

     # specify a custom error page for all common HTTP errors
     error_page
         400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
         500 501 502 503 504 505 507
         @errors;

     # location block for our custom error page
     location @errors {
         internal;
         default_type "text/html; charset=utf-8";
         return 200 '
                 <!DOCTYPE html>
                 <html lang="en">
                 <head>
                     <meta charset="UTF-8">
                     <meta name="viewport" content="width=device-width, initial-scale=1.0">
                     <title>Error</title>
                     <style>
                         body { font-family: Arial, sans-serif; text-align: center; }
                         .error-container { margin-top: 50px; }
                     </style>
                 </head>
                 <body>
                     <div class="error-container">
                         <h1>Oh-weh! Da ging etwas schief.</h1>
                         <p>Wir haben technische Schwierigkeiten. Bitte versuchen Sie es sp&auml;ter noch einmal.</p>
                     </div>
                     <div class="error-container">
                         <h1>Oops! Something went wrong.</h1>
                         <p>We\'re experiencing technical difficulties. Please try again later.</p>
                     </div>
                 </body>
                 </html>
             ';
    }
}

