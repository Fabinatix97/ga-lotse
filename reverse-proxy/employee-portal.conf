server {
    listen       4000;
    server_name  reverse-proxy;

    #access_log  /var/log/nginx/host.access.log  main;

    location = /auth/keycloak {
        include forward_headers.conf;
        proxy_pass http://host.docker.internal:8092/auth/keycloak;
    }

    location = /auth/login/keycloak {
        include forward_headers.conf;
        proxy_pass http://host.docker.internal:8092/auth/login/keycloak;
    }

    location = /logout/keycloak {
        proxy_pass http://host.docker.internal:8092/logout/keycloak;
    }

    location = /logout {
        include forward_headers.conf;
        proxy_pass http://host.docker.internal:8092/logout;
    }

    location = /browser-aktualisieren {
        proxy_pass http://host.docker.internal:8092/browser_update_required.html;
    }

    location = /login-error {
        proxy_pass http://host.docker.internal:8092/login_error.html;
    }

    location /api/base/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8080/;
    }

    location /api/auditlog/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8094/;
    }

    location /api/inspection/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8081/;
    }

    # extend proxy_read_timeout for list imports
    location ~ /api/school-entry/import/(citizen|school|past-procedure)-list {
        include auth_api_request.conf;
        rewrite ^/api/school-entry/(.*) /$1 break;
        proxy_pass http://host.docker.internal:8082$uri$is_args$args;
        proxy_read_timeout 120;
    }

    location /api/school-entry/vaccinated-ids {
        return 404;
    }

    location /api/school-entry/vaccination-check {
        return 404;
    }

    location /api/school-entry/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8082/;
    }

    location /api/travel-medicine/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8085/;
    }

    location /api/measles-protection/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8086/;
    }

    location /api/statistics/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8087/;
    }

    location /api/opendata/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8096/;
    }

    location /api/chat-management/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8088/;
    }

    location /api/sti-protection/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8095/;
    }

    location /api/meds-abroad/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8100/;
    }

    #extend proxy_read_timeout for list import
    location /api/medical-registry/import {
        include auth_api_request.conf;
        rewrite ^/api/medical-registry/(.*) /$1 break;
        proxy_pass http://host.docker.internal:8097$uri$is_args$args;
        proxy_read_timeout 300;
    }

    location /api/medical-registry/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8097/;
    }

    # extend proxy_read_timeout for list import
    location /api/dental/children/import/ {
        include auth_api_request.conf;
        rewrite ^/api/dental/(.*) /$1 break;
        proxy_pass http://host.docker.internal:8098$uri$is_args$args;
        proxy_read_timeout 120;
    }

    location /api/dental/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8098/;
    }

    location /api/official-medical-service/ {
        include auth_api_request.conf;
        proxy_pass http://host.docker.internal:8099/;
    }

    # There is no need to expose synapse admin api to outside world
    location /api/synapse/_synapse/admin {
        return 404;
    }

    location /api/synapse/ {
        auth_request /synapse-auth;
        auth_request_set $resolved_authorization $upstream_http_authorization;
        proxy_set_header Authorization $resolved_authorization;

        rewrite ^/api/synapse/(.*) /$1 break;

        # note: do not add a path (even a single /) after the port in `proxy_pass`,
        # otherwise nginx will canonicalise the URI and cause signature verification
        # errors.
        proxy_pass http://host.docker.internal:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host:4000/api/synapse; # This value must match Synapse's public_baseurl in homeserver.template - otherwise synapse /login endpoint gets into "URL is not canonical" redirect death loop...

        # Nginx by default only allows file uploads up to 1M in size
        # Increase client_max_body_size to match max_upload_size defined in homeserver.yaml
        client_max_body_size 10M;

        # Synapse responses may be chunked, which is an HTTP/1.1 feature.
        proxy_http_version 1.1;
    }

    # handle disabled backends as 404
    # note: all /api/ routes must appear before this
    location /api/ {
      return 404;
    }

    # Needed to support hot-reloading of the local Next.js dev server
    # see https://nextjs.org/docs/pages/building-your-application/upgrading/version-12#hmr-connection-now-uses-a-websocket
    location /_next/webpack-hmr {
        proxy_pass http://host.docker.internal:3000/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Can't get nextjs to add crossorigin="use-credentials" to <link rel="manifest" />
    location = /manifest.json {
        proxy_pass http://host.docker.internal:3000/manifest.json;
    }

    # No authentication needed for security.txt
    location = /.well-known/security.txt {
        proxy_pass http://host.docker.internal:8080/public/department/security-txt;
    }
    location = /pgp-key.txt {
        proxy_pass http://host.docker.internal:8080/public/department/security-txt-public-key;
    }

    location / {
        include auth_request.conf;

        auth_request_set $resolved_location $upstream_http_location;
        auth_request_set $auth_cookie $upstream_http_set_cookie;

        error_page 401 = @handle_redirect;

        proxy_pass http://host.docker.internal:3000;
    }

    location @handle_redirect {
        add_header Set-Cookie $auth_cookie;

        return 302 $resolved_location;
    }

    location = /auth {
        internal;

        include forward_headers.conf;

        proxy_pass http://host.docker.internal:8092/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI     $request_uri;
        proxy_set_header X-Original-Method  $request_method;
        proxy_set_header X-Correlation-ID   $request_id;

        proxy_intercept_errors on;
        error_page 302 = @rewrite_302_to_401;
    }

    location = /synapse-auth {
        internal;

        include forward_headers.conf;

        proxy_pass http://host.docker.internal:8092/synapse;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
    }

    # Deny access to hidden files.
    location ~/\.{
        deny all;
    }

    # Unfortunately, Nginx does not allow to return a 302 in an auth_request.
    # So we workaround by temporarily rewriting it to 401
    location @rewrite_302_to_401 {
      return 401;
    }

    # specify a custom error page for all common HTTP errors
    error_page
        400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
        500 501 502 503 504 505 507
        @errors;

    # location block for our custom error page
    location @errors {
        internal;
        default_type "text/html; charset=utf-8";
        return 200 '
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Error</title>
                    <style>
                        body { font-family: Arial, sans-serif; text-align: center; }
                        .error-container { margin-top: 50px; }
                    </style>
                </head>
                <body>
                    <div class="error-container">
                        <h1>Oh-weh! Da ging etwas schief.</h1>
                        <p>Wir haben technische Schwierigkeiten. Bitte versuchen Sie es sp&auml;ter noch einmal.</p>
                    </div>
                    <div class="error-container">
                        <h1>Oops! Something went wrong.</h1>
                        <p>We\'re experiencing technical difficulties. Please try again later.</p>
                    </div>
                </body>
                </html>
            ';
    }
}
